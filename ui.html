<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Nyx</title>
  <style>
    :root { --bg: #1f1f23; --bar: #2b2b31; --tab: #36363d; --hover: #44444c; --text: #e8e8ea; --dim: #9a9aa2; --accent: #8b6cff; --top: 108px; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font: 13px "Segoe UI", sans-serif; user-select: none; }
    button { font: inherit; }

    #top { position: fixed; left: 0; top: 0; width: 100%; background: var(--bar); }
    #tabs { display: flex; align-items: flex-end; height: 36px; padding: 0 6px; gap: 2px; overflow: hidden; }
    .tab { display: flex; align-items: center; gap: 6px; flex: 0 1 220px; min-width: 60px; height: 30px; padding: 0 6px 0 10px; border-radius: 8px 8px 0 0; cursor: default; }
    .tab:hover { background: var(--hover); }
    .tab.active { background: var(--tab); }
    .tab img, .tab .spin { width: 16px; height: 16px; flex: none; }
    .tab .title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tab .x { flex: none; width: 20px; height: 20px; border: none; border-radius: 4px; background: none; color: var(--dim); cursor: pointer; }
    .tab .x:hover { background: #55555e; color: var(--text); }
    .spin { border: 2px solid var(--dim); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    #newtab { flex: none; width: 28px; height: 28px; margin-bottom: 2px; border: none; border-radius: 6px; background: none; color: var(--text); font-size: 18px; cursor: pointer; }
    #newtab:hover { background: var(--hover); }

    #toolbar { display: flex; align-items: center; gap: 4px; height: 42px; padding: 0 8px; background: var(--tab); }
    #catbtn svg { display: block; margin: auto; }
    #catbtn .slash { display: none; }
    #catbtn.off { opacity: 0.55; }
    #catbtn.off .slash { display: block; }
    .tb { position: relative; width: 32px; height: 32px; border: none; border-radius: 6px; background: none; color: var(--text); font-size: 16px; cursor: pointer; flex: none; }
    .tb:hover:not(:disabled) { background: var(--hover); }
    .tb:disabled { color: #5c5c64; cursor: default; }
    #urlwrap { flex: 1; position: relative; display: flex; align-items: center; }
    #url { width: 100%; height: 30px; padding: 0 36px 0 12px; border: 1px solid transparent; border-radius: 15px; background: var(--bg); color: var(--text); font: inherit; outline: none; }
    #url:focus { border-color: var(--accent); }
    #star { position: absolute; right: 3px; width: 26px; height: 26px; border: none; border-radius: 13px; background: none; color: var(--dim); font-size: 16px; cursor: pointer; }
    #star:hover { background: var(--hover); color: var(--text); }
    #star.on { color: #ffd23f; }
    #zoompill { display: none; height: 24px; padding: 0 10px; border: 1px solid #55555e; border-radius: 12px; background: none; color: var(--text); font-size: 12px; cursor: pointer; flex: none; }
    #zoompill:hover { background: var(--hover); }
    #dl { display: none; }
    #dl .ring { position: absolute; left: 6px; right: 6px; bottom: 4px; height: 3px; border-radius: 2px; background: #55555e; overflow: hidden; display: none; }
    #dl .ring div { height: 100%; background: var(--accent); width: 0; }
    #dl.busy .ring { display: block; }
    #dl.busy { color: var(--accent); }

    #bmbar { display: none; align-items: center; gap: 2px; height: 30px; padding: 0 8px; background: var(--tab); border-top: 1px solid #2f2f36; overflow: hidden; }
    .bm { display: flex; align-items: center; gap: 6px; max-width: 180px; height: 24px; padding: 0 8px; border: none; border-radius: 6px; background: none; color: var(--text); cursor: pointer; flex: none; }
    .bm:hover { background: var(--hover); }
    .bm img { width: 14px; height: 14px; flex: none; }
    .bm span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #bmhint { color: var(--dim); font-size: 12px; padding-left: 4px; }

    #findbar { display: none; align-items: center; gap: 6px; height: 38px; padding: 0 10px; background: var(--bar); border-top: 1px solid #3a3a42; }
    #findinput { width: 260px; height: 28px; padding: 0 10px; border: 1px solid #4a4a52; border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; outline: none; }
    #findinput:focus { border-color: var(--accent); }
    #findcount { min-width: 70px; color: var(--dim); font-size: 12px; }
    #findbar .tb { width: 28px; height: 28px; font-size: 14px; }

    #strip { position: fixed; right: 0; top: var(--top); width: 52px; height: calc(100vh - var(--top)); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0; background: var(--bar); border-left: 1px solid #3a3a42; }
    #sites { display: flex; flex-direction: column; gap: 8px; align-items: center; flex: 1; overflow-y: auto; }
    .site { position: relative; width: 38px; height: 38px; border: none; border-radius: 10px; background: none; cursor: pointer; display: grid; place-items: center; color: var(--text); }
    .site:hover { background: var(--hover); }
    .site.active { background: var(--tab); }
    .site.active::before { content: ""; position: absolute; right: -7px; top: 8px; width: 3px; height: 22px; border-radius: 2px; background: var(--accent); }
    .site img { width: 24px; height: 24px; border-radius: 4px; }
    #add { width: 38px; height: 38px; border: 1px dashed #5c5c64; border-radius: 10px; background: none; color: var(--dim); font-size: 20px; cursor: pointer; }
    #add:hover { color: var(--text); border-color: var(--text); }

    #handle { position: fixed; top: var(--top); width: 6px; height: calc(100vh - var(--top)); cursor: col-resize; background: #2b2b31; display: none; z-index: 5; }
    #handle::after { content: ""; position: absolute; left: 2px; top: 50%; width: 2px; height: 36px; margin-top: -18px; border-radius: 1px; background: #5c5c64; }
    #handle:hover, #handle.drag { background: var(--accent); }
    #handle:hover::after, #handle.drag::after { background: #fff; }
    #dragghost { position: fixed; top: var(--top); height: calc(100vh - var(--top)); background: #26262b; display: none; color: var(--dim); align-items: center; justify-content: center; }
    body.dragging { cursor: col-resize; }

    #addpanel { position: fixed; top: var(--top); height: calc(100vh - var(--top)); padding: 24px 20px; background: var(--bar); border-left: 1px solid #3a3a42; display: none; }
    #addpanel h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
    #addpanel input { width: 100%; height: 34px; padding: 0 10px; border: 1px solid #4a4a52; border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; outline: none; }
    #addpanel input:focus { border-color: var(--accent); }
    #addpanel .row { display: flex; gap: 8px; margin-top: 12px; }
    #addpanel .row button { height: 32px; padding: 0 16px; border: none; border-radius: 6px; cursor: pointer; }
    #addok { background: var(--accent); color: #fff; }
    #addcancel { background: var(--hover); color: var(--text); }
    #addpanel p { color: var(--dim); margin-top: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="top">
    <div id="tabs"></div>
    <div id="toolbar">
      <button class="tb" id="back" title="Back (Alt+Left)">&#8592;</button>
      <button class="tb" id="fwd" title="Forward (Alt+Right)">&#8594;</button>
      <button class="tb" id="reload" title="Reload (F5)">&#8635;</button>
      <button class="tb" id="home" title="Home (Alt+Home)">&#8962;</button>
      <div id="urlwrap">
        <input id="url" spellcheck="false" placeholder="Search Google or type a URL" />
        <button id="star" title="Bookmark this page (Ctrl+D)">&#9734;</button>
      </div>
      <button id="zoompill" title="Reset zoom (Ctrl+0)">100%</button>
      <button class="tb" id="catbtn" title="Cat on / off"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g fill="currentColor"><path d="M12 12.1c-3 0-6.1 2.9-6.1 5.8 0 2.1 1.7 3.1 3.3 3.1 1 0 1.8-.5 2.8-.5s1.8.5 2.8.5c1.6 0 3.3-1 3.3-3.1 0-2.9-3.1-5.8-6.1-5.8z"/><ellipse cx="4.9" cy="11.2" rx="2" ry="2.6" transform="rotate(-22 4.9 11.2)"/><ellipse cx="9.2" cy="6.1" rx="2.1" ry="2.9" transform="rotate(-8 9.2 6.1)"/><ellipse cx="14.8" cy="6.1" rx="2.1" ry="2.9" transform="rotate(8 14.8 6.1)"/><ellipse cx="19.1" cy="11.2" rx="2" ry="2.6" transform="rotate(22 19.1 11.2)"/></g><line class="slash" x1="3.5" y1="3.5" x2="20.5" y2="20.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <button class="tb" id="theme" title="Website theme">&#9728;</button>
      <button class="tb" id="dl" title="Downloads (Ctrl+J)">&#11015;<span class="ring"><div></div></span></button>
      <button class="tb" id="menu" title="Menu">&#8942;</button>
    </div>
    <div id="bmbar"></div>
    <div id="findbar">
      <input id="findinput" spellcheck="false" placeholder="Find on page" />
      <span id="findcount"></span>
      <button class="tb" id="findprev" title="Previous (Shift+Enter)">&#8593;</button>
      <button class="tb" id="findnext" title="Next (Enter)">&#8595;</button>
      <button class="tb" id="findclose" title="Close (Esc)">&#10005;</button>
    </div>
  </div>

  <div id="strip">
    <div id="sites"></div>
    <button id="add" title="Add a site">+</button>
  </div>

  <div id="handle" title="Drag to resize"></div>
  <div id="dragghost"></div>

  <div id="addpanel">
    <h2>Add a site to the sidebar</h2>
    <input id="addurl" spellcheck="false" placeholder="e.g. web.telegram.org" />
    <div class="row">
      <button id="addok">Add</button>
      <button id="addcancel">Cancel</button>
    </div>
    <p>Right-click any sidebar icon to reload it, open it in a tab, or remove it.</p>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const send = window.api.send;
    const make = (tag, props = {}) => Object.assign(document.createElement(tag), props);
    let urlEditing = false;
    let lastAddMode = false;
    let lastFindOpen = false;

    window.api.on('state', s => {
      document.documentElement.style.setProperty('--top', s.top + 'px');

      // tabs
      const tabsEl = $('tabs');
      tabsEl.innerHTML = '';
      s.tabs.forEach(t => {
        const el = make('div', { className: 'tab' + (t.id === s.activeTab ? ' active' : ''), title: t.title });
        const icon = t.loading ? make('div', { className: 'spin' }) : make('img', { src: t.favicon || '' });
        if (!t.loading && !t.favicon) icon.style.visibility = 'hidden';
        if (!t.loading) icon.onerror = () => { icon.style.visibility = 'hidden'; };
        const x = make('button', { className: 'x', textContent: '✕', title: 'Close (Ctrl+W)' });
        x.onclick = e => { e.stopPropagation(); send('tab:close', t.id); };
        el.onmousedown = e => { if (e.button === 1) { e.preventDefault(); send('tab:close', t.id); } };
        el.onclick = () => send('tab:select', t.id);
        el.append(icon, make('span', { className: 'title', textContent: t.title }), x);
        tabsEl.append(el);
      });
      const plus = make('button', { id: 'newtab', textContent: '+', title: 'New tab (Ctrl+T)' });
      plus.onclick = () => send('tab:new');
      tabsEl.append(plus);

      // toolbar
      $('back').disabled = !s.canBack;
      $('fwd').disabled = !s.canFwd;
      $('url').placeholder = `Search ${s.engineName} or type a URL`;
      if (!urlEditing) $('url').value = s.url;
      $('star').style.display = s.bookmarkable ? '' : 'none';
      $('star').classList.toggle('on', s.bookmarked);
      $('star').innerHTML = s.bookmarked ? '&#9733;' : '&#9734;';
      $('star').title = s.bookmarked ? 'Remove bookmark (Ctrl+D)' : 'Bookmark this page (Ctrl+D)';
      // Shows the mode you'll switch TO: sun while dark, moon while light.
      $('catbtn').classList.toggle('off', !s.cat);
      $('catbtn').title = s.cat ? 'Send the cat away' : 'Bring the cat back';
      $('theme').textContent = s.themeDark ? '\u2600' : '\u263E';
      $('theme').title = s.themeDark ? 'Switch websites to light theme' : 'Switch websites to dark theme';
      $('zoompill').style.display = s.zoom !== 100 ? 'block' : 'none';
      $('zoompill').textContent = s.zoom + '%';
      const dl = $('dl');
      dl.style.display = s.downloads.count ? 'block' : 'none';
      dl.classList.toggle('busy', s.downloads.active > 0);
      dl.querySelector('.ring div').style.width = s.downloads.progress == null ? '35%' : Math.round(s.downloads.progress * 100) + '%';
      dl.title = s.downloads.active ? `Downloading ${s.downloads.active} file(s) (Ctrl+J)` : 'Downloads (Ctrl+J)';

      // bookmarks bar
      const bar = $('bmbar');
      bar.style.display = s.showBar ? 'flex' : 'none';
      bar.innerHTML = '';
      if (!s.bookmarks.length) bar.append(make('span', { id: 'bmhint', textContent: 'Bookmark pages with the ☆ in the address bar or Ctrl+D. They show up here.' }));
      s.bookmarks.forEach(b => {
        const el = make('button', { className: 'bm', title: b.title });
        const img = make('img', { src: b.favicon || '' });
        if (!b.favicon) img.style.display = 'none';
        img.onerror = () => { img.style.display = 'none'; };
        el.append(img, make('span', { textContent: b.title }));
        el.onclick = e => send('bm:open', { id: b.id, newTab: e.ctrlKey });
        el.onauxclick = e => { if (e.button === 1) send('bm:open', { id: b.id, newTab: true }); };
        el.oncontextmenu = e => { e.preventDefault(); send('bm:menu', b.id); };
        bar.append(el);
      });

      // find bar
      $('findbar').style.display = s.find.open ? 'flex' : 'none';
      if (s.find.open && !lastFindOpen) { $('findinput').value = s.find.text; }
      lastFindOpen = s.find.open;
      $('findcount').textContent = !s.find.text ? '' : s.find.total ? `${s.find.active} of ${s.find.total}` : 'No results';

      // sidebar icons
      const sitesEl = $('sites');
      sitesEl.innerHTML = '';
      s.sites.forEach(site => {
        const b = make('button', { className: 'site' + (site.id === s.activeSite ? ' active' : ''), title: site.name });
        const img = make('img', { src: site.icon, alt: '' });
        img.onerror = () => { img.replaceWith(make('span', { textContent: site.name[0].toUpperCase() })); };
        b.append(img);
        b.onclick = () => send('site:click', site.id);
        b.oncontextmenu = e => { e.preventDefault(); send('site:menu', site.id); };
        sitesEl.append(b);
      });

      // add panel
      const ap = $('addpanel');
      ap.style.display = s.addMode ? 'block' : 'none';
      ap.style.left = (s.browserW + s.gap) + 'px';
      ap.style.width = s.panelW + 'px';
      if (s.addMode && !lastAddMode) { $('addurl').value = ''; $('addurl').focus(); }
      lastAddMode = s.addMode;

      // resize handle + placeholder shown while dragging
      const h = $('handle');
      h.style.display = s.panelW > 0 ? 'block' : 'none';
      h.style.left = s.browserW + 'px';
      h.classList.toggle('drag', s.dragging);
      document.body.classList.toggle('dragging', s.dragging);
      const g = $('dragghost');
      g.style.display = s.dragging ? 'flex' : 'none';
      g.style.left = (s.browserW + s.gap) + 'px';
      g.style.width = s.panelW + 'px';
      g.textContent = s.panelW + ' px';
    });

    // resizing the sidebar
    let resizing = false;
    $('handle').addEventListener('mousedown', e => { e.preventDefault(); resizing = true; send('resize:start'); });
    window.addEventListener('mousemove', e => { if (resizing) send('resize:move', e.clientX); });
    const stopResize = () => { if (resizing) { resizing = false; send('resize:end'); } };
    window.addEventListener('mouseup', stopResize);
    window.addEventListener('blur', stopResize);

    // address bar
    window.api.on('focus-url', () => { $('url').focus(); $('url').select(); });
    $('url').addEventListener('focus', () => { urlEditing = true; setTimeout(() => $('url').select(), 0); });
    $('url').addEventListener('blur', () => { urlEditing = false; });
    $('url').addEventListener('keydown', e => {
      if (e.key === 'Enter') { send('nav:go', e.target.value); e.target.blur(); }
      if (e.key === 'Escape') e.target.blur();
    });
    $('back').onclick = () => send('nav:back');
    $('fwd').onclick = () => send('nav:fwd');
    $('reload').onclick = () => send('nav:reload');
    $('home').onclick = () => send('nav:home');
    $('star').onclick = () => send('bm:toggle');
    $('catbtn').onclick = () => send('cat:toggle');
    $('theme').onclick = () => send('theme:cycle');
    $('zoompill').onclick = () => send('zoom:reset');
    $('dl').onclick = () => send('downloads:open');
    $('menu').onclick = () => { const r = $('menu').getBoundingClientRect(); send('menu:open', { x: r.right - 250, y: r.bottom }); };

    // find bar
    window.api.on('focus-find', () => { $('findinput').focus(); $('findinput').select(); });
    $('findinput').addEventListener('input', e => send('find:query', e.target.value));
    $('findinput').addEventListener('keydown', e => {
      if (e.key === 'Enter') send('find:next', e.shiftKey);
      if (e.key === 'Escape') send('find:close');
    });
    $('findprev').onclick = () => send('find:next', true);
    $('findnext').onclick = () => send('find:next', false);
    $('findclose').onclick = () => send('find:close');

    // sidebar
    $('add').onclick = () => send('add:open');
    $('addok').onclick = () => send('site:add', $('addurl').value);
    $('addcancel').onclick = () => send('add:cancel');
    $('addurl').addEventListener('keydown', e => {
      if (e.key === 'Enter') send('site:add', e.target.value);
      if (e.key === 'Escape') send('add:cancel');
    });
  </script>
</body>
</html>
