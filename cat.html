<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; overflow: hidden; }
  canvas { position: absolute; bottom: 0; left: -44px; display: block; opacity: 0; transform-origin: 50% 100%; }
</style>
<div id="stage"><canvas id="c"></canvas></div>
<script>
// A real black cat (cat.png, a transparent cut-out) resting on the window, with a ground shadow, slow breathing and blinking.
// If cat.png is missing nothing is shown. ?freeze=<seconds> draws one still frame without fading (for testing).
const q = new URLSearchParams(location.search);
const DISPLAY_H = +q.get('h') || 130;                        // on-screen height of the cat, in CSS px
const freeze = q.has('freeze') ? +q.get('freeze') : null;
const dpr = window.devicePixelRatio || 1;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = u => u * u * (3 - 2 * u);

// where the eyes are in cat.png (pixels), used to draw the eyelids for blinking
const EYES = [{ x: 171.6, y: 152.1 }, { x: 264.3, y: 150 }], EYE_RX = 21, EYE_RY = 13;

const darkMQ = matchMedia('(prefers-color-scheme: dark)');   // the overlay follows the browser's theme setting
const img = new Image();
let ready = false, S = 1, PAD_X = 130, PAD_R = 70, PAD_B = 10, W = 0, H = 0, readyResolve;   // PAD_X leaves room on the left for her tail
const loaded = new Promise(r => (readyResolve = r));
img.onload = () => {
  S = DISPLAY_H / img.naturalHeight;
  W = Math.round(img.naturalWidth * S + PAD_X + PAD_R); H = Math.round(DISPLAY_H + PAD_B + 6);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ready = true; readyResolve();
};
img.onerror = () => { ready = false; readyResolve(); };
img.src = 'cat.png';

function pool(cx, cy, rx, ry, a) {                           // soft elliptical shadow on the floor
  const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, rx);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(0.55, `rgba(0,0,0,${a * 0.4})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.translate(cx, cy); ctx.scale(1, ry / rx); ctx.translate(-cx, -cy);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, rx, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}

// A glossy black tail that matches her coat. The photo hides her real one, so this lies along the floor behind her haunch and wags.
const tailSeed = Array.from({ length: 1200 }, (_, i) => { let x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); });
// "how dark" the page is, eased over about half a second so every theme-dependent detail blends instead of switching in one frame
let dm = darkMQ.matches ? 1 : 0, lastT = 0;
function stepTheme(t) {
  const target = darkMQ.matches ? 1 : 0, dt = Math.max(0, Math.min(0.1, t - lastT)); lastT = t;
  dm += (target - dm) * (1 - Math.exp(-dt / 0.22));
  if (Math.abs(target - dm) < 0.002) dm = target;
}

function tail(t, floor) {
  const dm = 1;                                                                        // the tail looks the same on light and dark pages (this shadows the page's eased dark amount)
  const KS = DISPLAY_H / 150, N = 20, L = 5.2 * KS, wag = 1, wf = 1 - 0.1 * (1 - dm);
  let x = PAD_X + 84 * S, y = floor - 92 * S, a = Math.PI - 0.5;                     // starts behind the haunch, heading left and down to the floor
  const pts = [{ x, y }], widths = [15 * KS * wf];
  for (let i = 0; i < N; i++) {
    const curl = i < 4 ? 0.08 : i < 12 ? 0.014 : 0.12;                                  // eases down onto the floor, runs along it, then the tip lifts
    a += curl + Math.sin(t * 3.3 - i * 0.3) * 0.16 * wag * (0.1 + i / N);            // the wag runs up the tail as a wave
    x += Math.cos(a) * L; y = Math.min(floor - 0.5, y + Math.sin(a) * L); pts.push({ x, y }); widths.push((15 + 4.5 * Math.sin(Math.PI * Math.min(1, (i + 1) / (N * 0.8))) - (i / N) * 6) * KS * wf);
  }
  const n = pts.length, Lp = [], Rp = [];
  for (let i = 0; i < n; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(n - 1, i + 1)];
    let dx = p1.x - p0.x, dy = p1.y - p0.y; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
    Lp.push({ x: pts[i].x - dy * widths[i] / 2, y: pts[i].y + dx * widths[i] / 2 });
    Rp.push({ x: pts[i].x + dy * widths[i] / 2, y: pts[i].y - dx * widths[i] / 2 });
  }
  const tip = { x: pts[n - 1].x + Math.cos(a) * 2.4, y: pts[n - 1].y + Math.sin(a) * 2.4 };
  const ring = [...Lp, tip, ...Rp.reverse()];
  const darkOn = dm > 0.004, lightOn = dm < 0.996;
  const tangent = i => Math.atan2(pts[Math.min(n - 1, i + 1)].y - pts[Math.max(0, i - 1)].y, pts[Math.min(n - 1, i + 1)].x - pts[Math.max(0, i - 1)].x);
  ctx.save();
  pool(pts[Math.floor(n / 2)].x, floor + 1, 40, 2.5, 0.45);                              // contact shadow under the tail

  // two styles of fluffy edge, cross-faded by `dm`: a soft halo for dark pages, a layered fur falloff for light ones
  if (darkOn) {
    ctx.save(); ctx.globalAlpha = dm; ctx.filter = 'blur(2.6px)'; ctx.strokeStyle = 'rgba(6,6,9,0.5)'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 0; i < n - 1; i++) { ctx.lineWidth = widths[i] + 6; ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[i + 1].x, pts[i + 1].y); ctx.stroke(); }
    ctx.restore();
  }
  if (lightOn) {
    const polyPath = wArr => {
      const A = [], B = [];
      for (let i = 0; i < n; i++) {
        const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(n - 1, i + 1)];
        let dx = p1.x - p0.x, dy = p1.y - p0.y; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
        A.push({ x: pts[i].x - dy * wArr[i] / 2, y: pts[i].y + dx * wArr[i] / 2 }); B.push({ x: pts[i].x + dy * wArr[i] / 2, y: pts[i].y - dx * wArr[i] / 2 });
      }
      const r2 = [...A, tip, ...B.reverse()];
      ctx.beginPath(); ctx.moveTo((r2[0].x + r2[1].x) / 2, (r2[0].y + r2[1].y) / 2);
      for (let i = 1; i < r2.length; i++) { const p = r2[i], q3 = r2[(i + 1) % r2.length]; ctx.quadraticCurveTo(p.x, p.y, (p.x + q3.x) / 2, (p.y + q3.y) / 2); }
      ctx.closePath();
    };
    ctx.save(); ctx.globalAlpha = 1 - dm; ctx.filter = 'blur(0.8px)'; ctx.fillStyle = 'rgba(6,6,9,0.15)';
    for (let Ly = 0; Ly < 7; Ly++) { polyPath(widths.map((w, i) => w / wf * (1 + 0.035 * (Ly + 1)) * (1 + (tailSeed[(i * 7 + Ly * 13) % 1200] - 0.5) * 0.1))); ctx.fill(); }
    ctx.restore();
  }

  // the tail itself
  ctx.filter = `blur(${(0.5 + 0.3 * dm).toFixed(2)}px)`;                               // as soft as the photograph, crisper on a light page
  ctx.beginPath(); ctx.moveTo((ring[0].x + ring[1].x) / 2, (ring[0].y + ring[1].y) / 2);
  for (let i = 1; i < ring.length; i++) { const p = ring[i], q2 = ring[(i + 1) % ring.length]; ctx.quadraticCurveTo(p.x, p.y, (p.x + q2.x) / 2, (p.y + q2.y) / 2); }
  ctx.closePath();
  const g = ctx.createLinearGradient(0, floor - 40, 0, floor);
  g.addColorStop(0, '#16161a'); g.addColorStop(0.5, '#08080b'); g.addColorStop(1, '#030304');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = `rgba(140,150,176,${(0.07 + 0.09 * dm).toFixed(3)})`; ctx.lineWidth = 1.6; ctx.lineCap = 'round';   // sheen along the top edge, like the coat
  ctx.beginPath(); ctx.moveTo(Lp[1].x, Lp[1].y); for (let i = 2; i < n; i++) ctx.lineTo(Lp[i].x, Lp[i].y); ctx.stroke();

  // fur details, each style fading in and out with the theme
  ctx.lineCap = 'round';
  if (lightOn) {                                                                       // a few fine, curved flyaway hairs lying along the tail
    ctx.save(); ctx.globalAlpha = 1 - dm; ctx.filter = 'blur(0.3px)';
    for (let k = 0; k < 26; k++) {
      const r = j => tailSeed[(300 + k * 7 + j) % 1200];
      const i = 1 + Math.floor(r(0) * (n - 3)), sd = r(1) < 0.5 ? Lp : Rp, out = sd === Lp ? 1 : -1, p = sd[i];
      const ang = tangent(i), len = (7 + r(2) * 9) * KS, bow = (1 + r(3) * 2.2) * KS * out;
      const ox = Math.cos(ang + Math.PI / 2) * -out, oy = Math.sin(ang + Math.PI / 2) * -out;
      const ex = p.x + Math.cos(ang) * len + ox * 1.2 * KS * r(2), ey = p.y + Math.sin(ang) * len + oy * 1.2 * KS * r(2);
      ctx.strokeStyle = `rgba(6,6,9,${0.22 + 0.2 * r(4)})`; ctx.lineWidth = 0.45;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.quadraticCurveTo((p.x + ex) / 2 + ox * bow, (p.y + ey) / 2 + oy * bow, ex, ey); ctx.stroke();
    }
    ctx.restore();
  }
  if (darkOn) {                                                                        // many fine strands swept towards the tip, a bushy plume, a little fur texture
    ctx.save(); ctx.globalAlpha = dm;
    for (let i = 1; i < n; i++) for (let sd = 0; sd < 2; sd++) for (let k = 0; k < 8; k++) {
      const r = j => tailSeed[(i * 48 + sd * 24 + k * 3 + j) % 1200];
      const p = (sd ? Rp : Lp)[i], ang = tangent(i);
      const a2 = ang + (sd ? -1 : 1) * (0.3 + r(0) * 0.55), len = (2.6 + r(2) * 4.2) * (0.75 + 0.45 * widths[i] / (15 * KS * wf)) * KS;
      const along = (k - 3.5) * 0.9, inset = r(1) * 3 * KS, inward = ang + (sd ? -Math.PI / 2 : Math.PI / 2);
      const sx = p.x + Math.cos(ang) * along - Math.cos(inward) * inset, sy = p.y + Math.sin(ang) * along - Math.sin(inward) * inset;
      ctx.strokeStyle = r(1) < 0.22 ? 'rgba(150,160,185,0.2)' : 'rgba(6,6,9,0.62)'; ctx.lineWidth = 0.45 + r(2) * 0.4;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(a2) * len, sy + Math.sin(a2) * len); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(140,150,176,0.09)'; ctx.lineWidth = 0.5;
    for (let i = 1; i < n - 1; i++) for (let k = 0; k < 4; k++) {
      const r = j => tailSeed[(i * 12 + k * 3 + j + 450) % 1200], p0 = pts[i], off = (r(0) - 0.5) * widths[i] * 0.75, ang = tangent(i);
      const cx0 = p0.x - Math.sin(ang) * off, cy0 = p0.y + Math.cos(ang) * off;
      ctx.beginPath(); ctx.moveTo(cx0, cy0); ctx.lineTo(cx0 + Math.cos(ang) * 4, cy0 + Math.sin(ang) * 4); ctx.stroke();
    }
    ctx.restore();
  }
  const plume = (isDark, amul) => {                                                    // a soft plume at the tip, bushier on dark pages and lighter on white
    ctx.save(); ctx.globalAlpha = amul;
    for (let k = 0; k < (isDark ? 28 : 8); k++) {
      const r = j => tailSeed[(700 + k * 5 + j) % 1200], t0 = pts[n - 1];
      const a3 = a + (r(0) - 0.5) * (isDark ? 1.5 : 0.7), len = (3 + r(1) * (isDark ? 6 : 5)) * KS * (isDark ? 1 : 0.8), off = (r(2) - 0.5) * (isDark ? 6 : 5) * KS;
      ctx.strokeStyle = r(3) < 0.2 ? 'rgba(150,160,185,0.18)' : `rgba(6,6,9,${isDark ? 0.62 : 0.3})`; ctx.lineWidth = (0.5 + r(4) * 0.4) * (isDark ? 1 : 0.7);
      ctx.beginPath(); ctx.moveTo(t0.x - Math.sin(a) * off, t0.y + Math.cos(a) * off); ctx.lineTo(t0.x - Math.sin(a) * off + Math.cos(a3) * len, t0.y + Math.cos(a) * off + Math.sin(a3) * len); ctx.stroke();
    }
    ctx.restore();
  };
  if (darkOn) plume(true, dm);
  if (lightOn) plume(false, 1 - dm);
  ctx.restore();
}

// A red collar with a gold buckle and a little bell that swings as she breathes. Coordinates are in the photo's own pixels (cat.png), so it stays put on her neck at any size.
function collar(t, floor) {
  const X = ix => PAD_X + ix * S, Y = iy => floor + 3 - DISPLAY_H + iy * S;
  const P0 = { x: 146, y: 266 }, C = { x: 222, y: 304 }, P1 = { x: 298, y: 266 }, th = 20 * S;
  const bez = (u, k = 0) => ({ x: (1 - u) * (1 - u) * P0.x + 2 * (1 - u) * u * C.x + u * u * P1.x, y: (1 - u) * (1 - u) * P0.y + 2 * (1 - u) * u * C.y + u * u * P1.y + k });
  const path = (dy = 0) => { ctx.beginPath(); ctx.moveTo(X(P0.x), Y(P0.y + dy)); ctx.quadraticCurveTo(X(C.x), Y(C.y + dy), X(P1.x), Y(P1.y + dy)); };
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // soft shadow the collar throws on her fur
  ctx.save(); ctx.filter = 'blur(0.9px)'; ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = th + 1.2; path(5); ctx.stroke(); ctx.restore();
  // the band
  const g = ctx.createLinearGradient(0, Y(266), 0, Y(310));
  g.addColorStop(0, '#d8222f'); g.addColorStop(0.5, '#a80f22'); g.addColorStop(1, '#5f0716');
  ctx.strokeStyle = g; ctx.lineWidth = th; ctx.lineCap = 'butt'; path(); ctx.stroke();
  ctx.lineCap = 'butt';
  const wrap = ctx.createLinearGradient(X(P0.x), 0, X(P1.x), 0);
  wrap.addColorStop(0, 'rgba(0,0,0,0.85)'); wrap.addColorStop(0.1, 'rgba(0,0,0,0.5)'); wrap.addColorStop(0.24, 'rgba(0,0,0,0)'); wrap.addColorStop(0.76, 'rgba(0,0,0,0)'); wrap.addColorStop(0.9, 'rgba(0,0,0,0.5)'); wrap.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.strokeStyle = wrap; ctx.lineWidth = th; path(); ctx.stroke();
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,150,150,0.24)'; ctx.lineWidth = Math.max(0.7, th * 0.2); path(-5.2); ctx.stroke();         // light catching the top edge
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = Math.max(0.7, th * 0.2); path(6); ctx.stroke();                   // and the shade on the lower edge
  ctx.save(); ctx.setLineDash([1.4, 1.5]); ctx.strokeStyle = 'rgba(255,225,225,0.5)'; ctx.lineWidth = 0.45; path(-3.2); ctx.stroke(); path(3.4); ctx.stroke(); ctx.restore();   // stitching
  // gold buckle on the right
  const bu = bez(0.78), bu2 = bez(0.8), ang = Math.atan2(bu2.y - bu.y, bu2.x - bu.x);
  ctx.save(); ctx.translate(X(bu.x), Y(bu.y)); ctx.rotate(ang);
  const bw = 15 * S, bh = th * 1.25;
  const bg = ctx.createLinearGradient(0, -bh / 2, 0, bh / 2); bg.addColorStop(0, '#fff0a8'); bg.addColorStop(0.5, '#e2b53a'); bg.addColorStop(1, '#9a6d12');
  ctx.strokeStyle = bg; ctx.lineWidth = Math.max(0.9, 2.6 * S); ctx.strokeRect(-bw / 2, -bh / 2, bw, bh);
  ctx.fillStyle = bg; ctx.fillRect(-0.4, -bh / 2, 0.9, bh);
  ctx.restore();
  // the bell, hanging from the middle of the collar and swinging a little with her breathing
  const att = bez(0.5, 10), sw = 0.08 * Math.sin(t * 2.0 + 0.6) + 0.02 * Math.sin(t * 5.1), R = 22;
  const bx = att.x + Math.sin(sw) * R, by = att.y + Math.cos(sw) * R, br = 14 * S;
  ctx.save(); ctx.filter = 'blur(1px)'; ctx.fillStyle = 'rgba(0,0,0,0.5)';                                                  // shadow on her chest
  ctx.beginPath(); ctx.ellipse(X(bx) + 1.2, Y(by) + br * 1.1, br * 1.05, br * 0.55, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.strokeStyle = '#c9971c'; ctx.lineWidth = Math.max(0.8, 2 * S);                                                         // small ring it hangs from
  ctx.beginPath(); ctx.moveTo(X(att.x), Y(att.y)); ctx.lineTo(X(bx), Y(by - 14 * S / S * S * 0.6)); ctx.stroke();
  const bg2 = ctx.createRadialGradient(X(bx) - br * 0.35, Y(by) - br * 0.4, br * 0.1, X(bx), Y(by), br * 1.1);
  bg2.addColorStop(0, '#fff6bf'); bg2.addColorStop(0.35, '#f0c44a'); bg2.addColorStop(0.8, '#b8821a'); bg2.addColorStop(1, '#7a520c');
  ctx.fillStyle = bg2; ctx.beginPath(); ctx.arc(X(bx), Y(by), br, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(90,55,5,0.9)'; ctx.lineWidth = Math.max(0.5, 1.2 * S);                                              // the bell's slit and mouth
  ctx.beginPath(); ctx.moveTo(X(bx) - br * 0.78, Y(by) + br * 0.28); ctx.lineTo(X(bx) + br * 0.78, Y(by) + br * 0.28); ctx.stroke();
  ctx.fillStyle = 'rgba(60,35,0,0.85)'; ctx.beginPath(); ctx.ellipse(X(bx), Y(by) + br * 0.28, br * 0.16, br * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.ellipse(X(bx) - br * 0.38, Y(by) - br * 0.42, br * 0.22, br * 0.13, -0.6, 0, Math.PI * 2); ctx.fill();   // highlight
  ctx.restore();
}

function frame(t) {
  if (!ready) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const floor = H - PAD_B + 4, iw = img.naturalWidth * S, cx = PAD_X + iw / 2;
  stepTheme(t);
  const k = 1.55 - 0.55 * dm;                                // on a light page the shadow has to carry more weight (blended, not switched)
  // 1) wide soft pool plus a cast shadow thrown to the right (light from the upper left)
  pool(cx, floor - 1, iw * 0.9, 7, Math.min(0.95, 0.5 * k));
  pool(cx + iw * 0.12, floor, iw * 0.78, 5, Math.min(0.95, 0.4 * k));
  tail(t, floor);                                            // behind her, so the haunch covers its base
  // 2) the cat, with her paws pressed a few pixels into the shadow
  const br = 1 + Math.sin(t * 1.8) * 0.0045;                 // slow breathing, anchored at the floor
  ctx.save(); ctx.translate(cx, floor); ctx.scale(1, br); ctx.translate(-cx, -floor);
  ctx.drawImage(img, PAD_X, floor + 3 - DISPLAY_H, iw, DISPLAY_H);
  // darken the lowest part of her body, so the paws sink into the floor instead of hovering above it
  ctx.globalCompositeOperation = 'source-atop';
  const og = ctx.createLinearGradient(0, floor - 26, 0, floor + 4);
  og.addColorStop(0, 'rgba(0,0,0,0)'); og.addColorStop(1, `rgba(0,0,0,${(0.7 - 0.15 * dm).toFixed(3)})`);
  ctx.fillStyle = og; ctx.fillRect(0, floor - 26, W, 36);
  ctx.globalCompositeOperation = 'source-over';
  collar(t, floor);
  // 3) tight contact shadow drawn over the paws' bottom edge: this is what makes her sit on the ground
  pool(cx, floor + 1, iw * 0.5, 4.5, Math.min(0.97, 0.85 * (1.15 - 0.15 * dm)));
  pool(cx - iw * 0.22, floor + 1, iw * 0.3, 4, 0.65 * (1.2 - 0.2 * dm));
  pool(cx + iw * 0.3, floor + 1, iw * 0.2, 3.5, 0.5 * (1.2 - 0.2 * dm));
  // blink: a feathered, fur-coloured eyelid closes over each eye
  const b = (t + 1.5) % 5.6;
  let closed = 0;
  if (b > 5.3) closed = Math.sin((b - 5.3) / 0.3 * Math.PI);
  else if (Math.floor((t + 1.5) / 5.6) % 3 === 2 && b > 2.2 && b < 3.6) closed = 0.55 * Math.sin((b - 2.2) / 1.4 * Math.PI);   // an occasional slow, sleepy half-close
  if (closed > 0.02) for (const e of EYES) {
    const ex = PAD_X + e.x * S, ey = floor - DISPLAY_H + e.y * S, rx = EYE_RX * S, ry = EYE_RY * S * 1.15 * closed;
    ctx.save(); ctx.translate(ex, ey - EYE_RY * S * (1 - closed) * 0.9); ctx.scale(1, ry / rx);   // the lid comes down from above
    const g = ctx.createRadialGradient(0, 0, rx * 0.35, 0, 0, rx);
    g.addColorStop(0, 'rgba(11,11,14,1)'); g.addColorStop(0.7, 'rgba(11,11,14,0.96)'); g.addColorStop(1, 'rgba(11,11,14,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx * 1.12, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

// ---- arriving and leaving: she fades in and settles, and fades out when it is time to go ----
function show(on, ms) {
  return new Promise(res => {
    cv.style.transition = `opacity ${ms}ms ease, transform ${ms}ms ease`;
    cv.style.opacity = on ? 1 : 0;
    cv.style.transform = on ? 'translateY(0) scale(1)' : 'translateY(6px) scale(0.97)';
    setTimeout(res, ms);
  });
}
window.catEnter = async () => { await loaded; if (!ready) return; cv.style.transition = 'none'; cv.style.transform = 'translateY(10px) scale(0.97)'; cv.offsetHeight; await show(true, 1600); };
window.catLeave = async () => { await loaded; await show(false, 1400); };

const t0 = performance.now();
if (freeze === null) (function loop(now) { frame((now - t0) / 1000); requestAnimationFrame(loop); })(t0);
loaded.then(() => { if (freeze !== null) { cv.style.opacity = 1; frame(freeze); } else window.catEnter(); });
</script>
