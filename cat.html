<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #mover { position: absolute; bottom: 0; left: 0; will-change: transform; }
  canvas { display: block; }
  canvas.flip { transform: scaleX(-1); }
</style>
<div id="mover"><canvas id="c"></canvas></div>
<script>
// A procedurally animated black cat, drawn side-on facing right (mirrored for right-to-left walks).
// ?w=<window width>&dir=ltr|rtl&speed=<px/s>   (&freeze=<seconds> draws one still frame, for testing)
const q = new URLSearchParams(location.search);
const W = +q.get('w') || innerWidth, speed = +q.get('speed') || 90, rtl = q.get('dir') === 'rtl';
const freeze = q.has('freeze') ? +q.get('freeze') : null;

const PAD = 50;                                              // room on the left so the tail isn't clipped
const TOP = 26;
const LW = 240 + PAD, LH = 140 + TOP, SCALE = +q.get('scale') || 0.9, GROUND = 130;       // logical drawing space and its on-screen scale
const cv = document.getElementById('c'), mover = document.getElementById('mover');
const dpr = window.devicePixelRatio || 1;
cv.width = LW * SCALE * dpr; cv.height = LH * SCALE * dpr;
cv.style.width = LW * SCALE + 'px'; cv.style.height = LH * SCALE + 'px';
if (rtl) cv.classList.add('flip');
const ctx = cv.getContext('2d');

// ---- gait ----
const STRIDE = 17;                                          // half stride length (logical px)
const DUTY = 0.6;                                           // fraction of the cycle a paw is on the ground
const PERIOD = (2 * STRIDE) / (DUTY * (speed / SCALE));     // seconds per cycle so paws don't slide on the ground
// lateral-sequence walk: near hind, near front, far hind, far front
const PHASE = { nearHind: 0, nearFront: 0.25, farHind: 0.5, farFront: 0.75 };

function foot(hipX, phase, t) {
  const p = (((t / PERIOD) + phase) % 1 + 1) % 1;
  if (p < DUTY) return { x: hipX + STRIDE - (p / DUTY) * 2 * STRIDE, y: GROUND };
  const u = (p - DUTY) / (1 - DUTY);
  return { x: hipX - STRIDE + 2 * STRIDE * u, y: GROUND - 11 * Math.sin(Math.PI * u) };
}

// two-bone IK: returns the middle joint. dir = +1 bends backwards, -1 bends forwards
function ik(ax, ay, tx, ty, l1, l2, dir) {
  let dx = tx - ax, dy = ty - ay, d = Math.hypot(dx, dy);
  d = Math.min(d, l1 + l2 - 0.01);
  const base = Math.atan2(dy, dx);
  const a = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d))));
  const ang = base + dir * a;
  return { x: ax + Math.cos(ang) * l1, y: ay + Math.sin(ang) * l1 };
}

// ---- drawing helpers ----
const FUR = '#070708', FUR_FAR = '#0d0d10', RIM = 'rgba(120,125,140,0.55)';

function limb(points, widths, col) {
  // rim light underneath, fur on top; tapered by drawing each bone with its own width
  for (const [stroke, extra] of [[RIM, 1.6], [col, 0]]) {
    ctx.strokeStyle = stroke; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 0; i < points.length - 1; i++) {
      ctx.lineWidth = widths[i] + extra;
      ctx.beginPath(); ctx.moveTo(points[i].x, points[i].y); ctx.lineTo(points[i + 1].x, points[i + 1].y); ctx.stroke();
    }
  }
}

function paw(f, col) {
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(f.x + 2.5, f.y - 2.2, 6, 3.6, 0, 0, Math.PI * 2); ctx.fill();
}

function frontLeg(phase, t, col, near) {
  const sh = { x: 148 - (near ? 0 : 5), y: 73 };
  const f = foot(sh.x + 6, phase, t);
  const wrist = { x: f.x - 1, y: f.y - 9 };
  const elbow = ik(sh.x, sh.y, wrist.x, wrist.y, 27, 22, +1);
  limb([sh, elbow, wrist, { x: f.x, y: f.y - 3 }], [11, 7, 5.5], col);
  paw(f, col);
}

function hindLeg(phase, t, col, near) {
  const hp = { x: 74 + (near ? 0 : 5), y: 72 };
  const f = foot(hp.x - 4, phase, t);
  const hock = { x: f.x - 4, y: f.y - 15 };
  const knee = ik(hp.x, hp.y, hock.x, hock.y, 27, 25, -1);
  limb([hp, knee, hock, { x: f.x, y: f.y - 3 }], [14, 8, 5, 5], col);
  paw(f, col);
}

function tail(t, bodyY) {
  const N = 14, L = 6.6;
  let x = 55, y = 64 + bodyY, a = Math.PI + 0.12;
  const pts = [{ x, y }];
  for (let i = 0; i < N; i++) {
    a += 0.085 + Math.sin(t * 2.6 - i * 0.5) * 0.05 * (0.25 + i / N);
    x += Math.cos(a) * L; y += Math.sin(a) * L; pts.push({ x, y });
  }
  const w = i => 8 - (i / N) * 3.2;
  limb(pts, pts.slice(1).map((_, i) => w(i)), FUR);
}

function eye(cx, cy, open) {
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(1, Math.max(0.08, open));
  ctx.shadowColor = 'rgba(70,255,120,0.85)'; ctx.shadowBlur = 7;
  const g = ctx.createRadialGradient(0, 0, 0.5, 0, 0, 5.5);
  g.addColorStop(0, '#c9ffb0'); g.addColorStop(0.45, '#3fe06c'); g.addColorStop(1, '#0f8a3a');
  ctx.fillStyle = g;
  ctx.beginPath();                                          // almond shape
  ctx.moveTo(-5.6, 0.4); ctx.quadraticCurveTo(0, -5.4, 5.6, 0.2); ctx.quadraticCurveTo(0, 4.8, -5.6, 0.4); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0.4, 0, 1.25, 3.6, 0, 0, Math.PI * 2); ctx.fill();   // slit pupil
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(-1.6, -1.6, 0.9, 0, Math.PI * 2); ctx.fill();            // glint
  ctx.restore();
}

function head(t, bodyY, nod) {
  ctx.save();
  ctx.translate(0, bodyY + nod);
  // neck
  // ears
  for (const e of [
    [[166, 46], [169, 24], [184, 41]],                      // far ear
    [[182, 41], [196, 26], [199, 49]],                      // near ear
  ]) {
    ctx.fillStyle = FUR; ctx.strokeStyle = RIM; ctx.lineWidth = 1.2; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(...e[0]); ctx.lineTo(...e[1]); ctx.lineTo(...e[2]); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#2b1c21';                                // inner ears
  ctx.beginPath(); ctx.moveTo(171, 40); ctx.lineTo(171.5, 29); ctx.lineTo(180, 39); ctx.fill();
  ctx.beginPath(); ctx.moveTo(187, 40); ctx.lineTo(194, 31); ctx.lineTo(195.5, 44); ctx.fill();
  // skull + muzzle
  const hg = ctx.createRadialGradient(176, 46, 2, 180, 54, 24);
  hg.addColorStop(0, '#1b1b20'); hg.addColorStop(1, FUR);
  ctx.fillStyle = hg; ctx.strokeStyle = RIM; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(164, 52);
  ctx.bezierCurveTo(164, 38, 192, 36, 198, 48);
  ctx.bezierCurveTo(203, 54, 204, 62, 198, 67);
  ctx.bezierCurveTo(190, 73, 168, 72, 164, 60);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // eyes (blink every ~4.5 s)
  const bl = t % 4.5, open = bl > 4.3 ? Math.abs(Math.cos((bl - 4.3) / 0.2 * Math.PI / 2)) : 1;
  eye(177, 52, open); eye(191, 52, open);
  // nose + mouth
  ctx.fillStyle = '#5b3a42';
  ctx.beginPath(); ctx.moveTo(196.5, 60); ctx.lineTo(201, 60); ctx.lineTo(198.7, 63.2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(90,70,76,0.7)'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(198.7, 63.2); ctx.lineTo(198.7, 65); ctx.moveTo(198.7, 65); ctx.quadraticCurveTo(195, 68, 192, 65.5); ctx.stroke();
  // whiskers
  ctx.strokeStyle = 'rgba(235,235,240,0.55)'; ctx.lineWidth = 0.7;
  const sway = Math.sin(t * 6) * 0.6;
  for (const [dx, dy] of [[26, -5], [28, 1], [25, 7]]) {
    ctx.beginPath(); ctx.moveTo(196, 63); ctx.quadraticCurveTo(196 + dx * 0.55, 63 + dy * 0.3 + sway, 196 + dx, 63 + dy + sway); ctx.stroke();
  }
  ctx.restore();
}

function body() {
  const g = ctx.createLinearGradient(0, 40, 0, 92);
  g.addColorStop(0, '#202026'); g.addColorStop(0.35, '#0b0b0d'); g.addColorStop(1, '#030304');
  ctx.fillStyle = g; ctx.strokeStyle = RIM; ctx.lineWidth = 1.3; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(56, 68);
  ctx.bezierCurveTo(50, 53, 62, 46, 82, 46);                // rump and back
  ctx.bezierCurveTo(102, 47, 122, 44, 142, 45);
  ctx.bezierCurveTo(154, 45, 163, 41, 174, 44);             // neck rising to the head
  ctx.lineTo(176, 68);
  ctx.bezierCurveTo(170, 82, 160, 90, 146, 90);             // throat, chest
  ctx.bezierCurveTo(130, 91, 106, 90, 86, 90);              // belly
  ctx.bezierCurveTo(70, 90, 58, 82, 56, 68);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // soft highlight along the spine
  const sp = ctx.createLinearGradient(60, 0, 160, 0);
  sp.addColorStop(0, 'rgba(160,165,185,0)'); sp.addColorStop(0.5, 'rgba(160,165,185,0.22)'); sp.addColorStop(1, 'rgba(160,165,185,0)');
  ctx.strokeStyle = sp; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(66, 50); ctx.bezierCurveTo(96, 49, 122, 47, 150, 48); ctx.stroke();
}

// the muscle at the top of a near-side leg, so thigh and shoulder blend into the torso
function muscle(cx, cy, rx, ry, rot) {
  const g = ctx.createRadialGradient(cx - 3, cy - 5, 1, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, '#131316'); g.addColorStop(1, '#060607');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); ctx.fill();
}

function draw(t) {
  ctx.setTransform(dpr * SCALE, 0, 0, dpr * SCALE, PAD * dpr * SCALE, TOP * dpr * SCALE);
  ctx.clearRect(-PAD, -TOP, LW, LH);
  // ground shadow
  const sg = ctx.createRadialGradient(110, GROUND + 1, 4, 110, GROUND + 1, 90);
  sg.addColorStop(0, 'rgba(0,0,0,0.30)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.ellipse(110, GROUND + 1, 90, 6, 0, 0, Math.PI * 2); ctx.fill();

  const stepT = (t / PERIOD) * Math.PI * 4;
  const bob = Math.cos(stepT) * 1.1, roll = Math.sin(stepT / 2) * 0.012;

  // far legs and tail stay fixed to the ground/hips; the torso bobs and rolls a little
  frontLeg(PHASE.farFront, t, FUR_FAR, false);
  hindLeg(PHASE.farHind, t, FUR_FAR, false);
  ctx.save();
  ctx.translate(105, 66); ctx.rotate(roll); ctx.translate(-105, -66 + bob);
  tail(t, 0);
  body();
  ctx.restore();
  frontLeg(PHASE.nearFront, t, FUR, true);
  hindLeg(PHASE.nearHind, t, FUR, true);
  ctx.save(); ctx.translate(105, 66); ctx.rotate(roll); ctx.translate(-105, -66 + bob);
  muscle(80, 70, 15, 19, 0.35); muscle(147, 68, 10, 16, -0.2);
  ctx.restore();
  ctx.save();
  ctx.translate(105, 66); ctx.rotate(roll); ctx.translate(-105, -66);
  head(t, bob, Math.sin(stepT / 2 + 1) * 0.9);
  ctx.restore();
}

if (freeze !== null) {
  draw(freeze); mover.style.transform = 'translateX(20px)';
} else {
  const CATW = LW * SCALE;
  const from = rtl ? W : -CATW, to = rtl ? -CATW : W, dist = Math.abs(to - from), t0 = performance.now();
  (function step(now) {
    const t = (now - t0) / 1000;
    const p = Math.min(1, t * speed / dist);
    mover.style.transform = `translateX(${from + (to - from) * p}px)`;
    draw(t);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}
</script>
