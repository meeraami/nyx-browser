<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; overflow: hidden; }
  canvas { position: absolute; bottom: 0; left: 0; display: block; will-change: transform, opacity; }
  #c, #w { opacity: 0; }
</style>
<div id="stage"><canvas id="c"></canvas><canvas id="w"></canvas></div>
<script>
// A black cat sitting front-on, drawn procedurally: shaded coat, thousands of fur strands, a ground shadow.
// ?scale=<size>&life=<seconds visible>   (&freeze=<seconds> draws one still frame without fading, for testing)
const q = new URLSearchParams(location.search);
const SCALE = +q.get('scale') || 0.42;
const freeze = q.has('freeze') ? +q.get('freeze') : null;
const LW = 320, LH = 420;
const dpr = window.devicePixelRatio || 1, K = SCALE * dpr;

const cv = document.getElementById('c');
cv.width = Math.round(LW * K); cv.height = Math.round(LH * K);
cv.style.width = LW * SCALE + 'px'; cv.style.height = LH * SCALE + 'px';
const ctx = cv.getContext('2d');

// deterministic randomness, so the fur is identical every time
let seed = 11;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

// ---------- shapes ----------
const P = s => new Path2D(s);
const bodyPath = P('M116,160 C80,182 58,250 62,320 C66,372 108,394 160,394 C212,394 254,372 258,320 C262,250 240,182 204,160 Z');
const haunchPath = P('M80,262 C44,288 38,346 68,380 C92,396 122,392 128,372 L128,292 C114,264 100,254 80,262 Z');
const legL = P('M110,236 L152,236 L152,376 C152,392 110,392 110,376 Z');
const legR = P('M168,236 L210,236 L210,376 C210,392 168,392 168,376 Z');
const pawL = P('M100,378 C98,358 160,356 158,378 C160,396 98,398 100,378 Z');
const pawR = P('M162,378 C160,358 222,356 220,378 C222,396 160,398 162,378 Z');
const neckPath = P('M110,120 C112,160 98,182 78,214 L242,214 C222,182 208,160 210,120 Z');
const headPath = P('M98,98 C96,58 128,44 160,44 C192,44 224,58 222,98 C230,132 214,168 160,176 C106,168 90,132 98,98 Z');
const earLPath = P('M100,96 C92,66 94,34 98,16 C120,24 144,40 156,56 Z');
const earRPath = P('M220,96 C228,66 226,34 222,16 C200,24 176,40 164,56 Z');
const earLIn = P('M108,86 C103,62 104,42 107,30 C122,38 136,50 144,62 Z');
const earRIn = P('M212,86 C217,62 216,42 213,30 C198,38 184,50 176,62 Z');

// ---------- fur ----------
const LIGHT = { x: 105, y: 50 };                            // light comes from the upper left
const lit = (x, y) => Math.pow(clamp(1 - Math.hypot(x - LIGHT.x, y - LIGHT.y) / 300), 1.4);

function fur(c, path, box, count, flow, o) {
  c.save(); c.clip(path); c.lineCap = 'round';
  for (let i = 0; i < count; i++) {
    const x = box[0] + rnd() * box[2], y = box[1] + rnd() * box[3];
    const a = flow(x, y) + (rnd() - 0.5) * 0.3;
    const len = o.len[0] + rnd() * (o.len[1] - o.len[0]);
    const bend = (rnd() - 0.5) * 3;
    const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len;
    const l = lit(x, y);
    if (rnd() < o.light * (0.35 + l)) c.strokeStyle = `rgba(${o.tint},${(0.05 + rnd() * 0.17 * o.glint) * (0.3 + l * 1.4)})`;
    else c.strokeStyle = `rgba(0,0,0,${0.12 + rnd() * 0.28})`;
    c.lineWidth = 0.5 + rnd() * 0.5;
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo((x + ex) / 2 + bend, (y + ey) / 2 + bend, ex, ey); c.stroke();
  }
  c.restore();
}
const TINT = '152,160,182';
const headFlow = (x, y) => Math.atan2(y - 132 - (y < 110 ? 22 : 0), x - 160);   // streams outward from the nose bridge
const bodyFlow = (x, y) => Math.atan2(46 + (y - 170) * 0.2, (x - 160) * 0.35);

function pool(c, cx, cy, rx, ry, a) {                       // a soft elliptical shadow
  const g = c.createRadialGradient(cx, cy, 2, cx, cy, rx);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(0.55, `rgba(0,0,0,${a * 0.4})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.save(); c.translate(cx, cy); c.scale(1, ry / rx); c.translate(-cx, -cy);
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, rx, 0, Math.PI * 2); c.fill(); c.restore();
}

// ---------- static render, painted once into a cache ----------
const cache = document.createElement('canvas');
cache.width = cv.width; cache.height = cv.height;

function paintStatic(c) {
  c.setTransform(K, 0, 0, K, 0, 0);
  let g;

  pool(c, 160, 398, 150, 18, 0.55);                         // wide soft shadow
  pool(c, 160, 394, 120, 9, 0.85);                          // tight contact shadow under the paws

  // body, haunch, front legs
  g = c.createLinearGradient(60, 170, 250, 396);
  g.addColorStop(0, '#1d1e24'); g.addColorStop(0.45, '#0b0b0e'); g.addColorStop(1, '#030304');
  c.fillStyle = g; c.fill(bodyPath);
  g = c.createRadialGradient(70, 300, 6, 78, 320, 70);
  g.addColorStop(0, '#16171c'); g.addColorStop(1, '#050506');
  c.fillStyle = g; c.fill(haunchPath);
  c.fillStyle = '#060607'; c.fill(legL); c.fill(legR);
  g = c.createRadialGradient(160, 320, 2, 160, 320, 60);   // dark gap between the legs
  g.addColorStop(0, 'rgba(0,0,0,0.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(100, 240, 120, 150);
  g = c.createLinearGradient(104, 0, 215, 0);               // light catching the left leg
  g.addColorStop(0, 'rgba(120,128,150,0.20)'); g.addColorStop(0.35, 'rgba(120,128,150,0)');
  c.fillStyle = g; c.fill(legL);

  fur(c, bodyPath, [40, 150, 240, 250], 5200, bodyFlow, { len: [6, 12], light: 0.6, tint: TINT, glint: 0.55 });
  g = c.createLinearGradient(0, 120, 0, 214);
  g.addColorStop(0, 'rgba(11,11,14,1)'); g.addColorStop(0.6, 'rgba(11,11,14,0.8)'); g.addColorStop(1, 'rgba(11,11,14,0)');
  c.fillStyle = g; c.fill(neckPath);
  fur(c, neckPath, [78, 120, 164, 94], 1200, bodyFlow, { len: [6, 12], light: 0.6, tint: TINT, glint: 0.55 });
  g = c.createRadialGradient(160, 190, 4, 160, 190, 60);   // light on the chest
  g.addColorStop(0, 'rgba(120,128,150,0.16)'); g.addColorStop(1, 'rgba(120,128,150,0)');
  c.fillStyle = g; c.fillRect(90, 150, 140, 90);
  fur(c, haunchPath, [20, 250, 120, 150], 1500, (x) => Math.atan2(40, x - 40), { len: [6, 12], light: 0.7, tint: TINT, glint: 0.6 });
  fur(c, legL, [104, 236, 60, 160], 700, () => Math.PI / 2, { len: [6, 12], light: 0.6, tint: TINT, glint: 0.9 });
  fur(c, legR, [160, 236, 60, 160], 700, () => Math.PI / 2, { len: [6, 12], light: 0.5, tint: TINT, glint: 0.8 });

  for (const [paw, cx] of [[pawL, 129], [pawR, 191]]) {     // paws with toe lines
    g = c.createRadialGradient(cx - 8, 368, 2, cx, 380, 34);
    g.addColorStop(0, '#1a1b20'); g.addColorStop(1, '#050506');
    c.fillStyle = g; c.fill(paw);
    c.strokeStyle = 'rgba(0,0,0,0.6)'; c.lineWidth = 1.3; c.lineCap = 'round';
    for (const dx of [-9, 0, 9]) { c.beginPath(); c.moveTo(cx + dx, 380); c.lineTo(cx + dx, 388); c.stroke(); }
    c.strokeStyle = 'rgba(140,148,170,0.30)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(cx - 24, 366); c.quadraticCurveTo(cx, 358, cx + 24, 366); c.stroke();
    fur(c, paw, [cx - 32, 356, 64, 42], 160, () => Math.PI / 2, { len: [4, 8], light: 0.55, tint: TINT, glint: 0.8 });
  }

  // ears (behind the head)
  for (const [ear, inner, mirror] of [[earLPath, earLIn, false], [earRPath, earRIn, true]]) {
    g = c.createLinearGradient(mirror ? 230 : 90, 10, mirror ? 170 : 150, 90);
    g.addColorStop(0, mirror ? '#0a0a0c' : '#1d1e24'); g.addColorStop(1, '#050506');
    c.fillStyle = g; c.fill(ear);
    g = c.createLinearGradient(160, 20, 160, 90);
    g.addColorStop(0, '#2a1a1f'); g.addColorStop(1, '#0a0506');
    c.fillStyle = g; c.fill(inner);
    fur(c, inner, [mirror ? 170 : 100, 24, 50, 70], 90, () => -Math.PI / 2 + (mirror ? -0.35 : 0.35), { len: [5, 10], light: 0.8, tint: '120,100,104', glint: 0.8 });
    fur(c, ear, [mirror ? 170 : 90, 14, 60, 90], 160, () => -Math.PI / 2 + (mirror ? 0.4 : -0.4), { len: [5, 10], light: 0.5, tint: TINT, glint: 0.9 });
  }

  // head
  g = c.createRadialGradient(130, 70, 6, 160, 110, 100);
  g.addColorStop(0, '#24252c'); g.addColorStop(0.5, '#0d0d10'); g.addColorStop(1, '#040405');
  c.fillStyle = g; c.fill(headPath);
  fur(c, headPath, [90, 40, 140, 140], 4200, headFlow, { len: [5, 10], light: 0.7, tint: '156,164,186', glint: 0.8 });
  for (const ex of [133, 187]) {                            // darker fur around the eyes
    g = c.createRadialGradient(ex, 102, 4, ex, 102, 30);
    g.addColorStop(0, 'rgba(0,0,0,0.7)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(ex - 32, 70, 64, 64);
  }
  g = c.createRadialGradient(150, 62, 2, 150, 70, 56);      // sheen on the forehead
  g.addColorStop(0, 'rgba(170,178,200,0.26)'); g.addColorStop(1, 'rgba(170,178,200,0)');
  c.save(); c.clip(headPath); c.fillStyle = g; c.fillRect(90, 40, 140, 100); c.restore();
  g = c.createLinearGradient(160, 96, 160, 130);            // and down the bridge of the nose
  g.addColorStop(0, 'rgba(150,158,180,0)'); g.addColorStop(0.5, 'rgba(150,158,180,0.13)'); g.addColorStop(1, 'rgba(150,158,180,0)');
  c.fillStyle = g; c.fillRect(153, 96, 14, 36);
  g = c.createLinearGradient(90, 20, 230, 180);             // rim light on the lit edges
  g.addColorStop(0, 'rgba(170,180,205,0.55)'); g.addColorStop(0.5, 'rgba(170,180,205,0.05)'); g.addColorStop(1, 'rgba(170,180,205,0)');
  c.strokeStyle = g; c.lineWidth = 1.6; c.lineJoin = 'round';
  c.stroke(headPath); c.stroke(earLPath); c.stroke(earRPath);

  // muzzle: whisker pads, nose, mouth
  g = c.createRadialGradient(160, 140, 2, 160, 142, 36);
  g.addColorStop(0, 'rgba(60,62,72,0.55)'); g.addColorStop(1, 'rgba(60,62,72,0)');
  c.fillStyle = g; c.fillRect(120, 118, 80, 50);
  c.fillStyle = 'rgba(8,8,10,0.9)';
  for (const side of [-1, 1]) for (let r = 0; r < 3; r++) for (let k = 0; k < 3; k++) {
    c.beginPath(); c.arc(160 + side * (14 + k * 7 + r * 1.5), 142 + r * 5 - k * 1.2, 0.9, 0, Math.PI * 2); c.fill();
  }
  g = c.createLinearGradient(0, 124, 0, 140);
  g.addColorStop(0, '#4a3c42'); g.addColorStop(1, '#1d1618');
  c.fillStyle = g;
  c.beginPath(); c.moveTo(150, 125); c.quadraticCurveTo(160, 121, 170, 125); c.quadraticCurveTo(168, 134, 160, 139); c.quadraticCurveTo(152, 134, 150, 125); c.fill();
  c.fillStyle = 'rgba(190,175,185,0.35)';
  c.beginPath(); c.ellipse(157, 126, 4, 1.6, -0.2, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.55)'; c.lineWidth = 1; c.lineCap = 'round';
  c.beginPath(); c.moveTo(160, 139); c.lineTo(160, 146);
  c.moveTo(160, 146); c.quadraticCurveTo(155, 150, 149, 148);
  c.moveTo(160, 146); c.quadraticCurveTo(165, 150, 171, 148); c.stroke();
  g = c.createRadialGradient(160, 152, 1, 160, 152, 16);   // shadowed chin
  g.addColorStop(0, 'rgba(0,0,0,0.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(140, 140, 40, 30);

  // whiskers, long and fine, plus a few above the eyes
  c.lineWidth = 0.7;
  for (const side of [-1, 1]) for (const [dy, dl] of [[-14, 6], [2, 10], [18, 12], [34, 12]]) {
    const sx = 160 + side * 22, sy = 143 + dy * 0.25;
    const ex = 160 + side * (92 + dl * 2), ey = 152 + dy * 0.9;
    const wg = c.createLinearGradient(sx, sy, ex, ey);
    wg.addColorStop(0, 'rgba(225,228,238,0.55)'); wg.addColorStop(1, 'rgba(225,228,238,0.05)');
    c.strokeStyle = wg;
    c.beginPath(); c.moveTo(sx, sy); c.quadraticCurveTo((sx + ex) / 2, sy - 12 - Math.abs(dy) * 0.2, ex, ey); c.stroke();
  }
  c.strokeStyle = 'rgba(225,228,238,0.35)';
  for (const side of [-1, 1]) { c.beginPath(); c.moveTo(160 + side * 38, 84); c.quadraticCurveTo(160 + side * 52, 72, 160 + side * 62, 74); c.stroke(); }
}
paintStatic(cache.getContext('2d'));

// ---------- live parts: eyes and breathing ----------
function eye(c, cx, cy, flip, open) {
  const o = Math.max(0.04, open);
  c.save(); c.translate(cx, cy); c.scale(flip ? -1 : 1, 1);
  const almond = () => { c.beginPath(); c.moveTo(-14, 2.5); c.quadraticCurveTo(-1, -13, 14, -1.5); c.quadraticCurveTo(0, 10, -14, 2.5); c.closePath(); };
  c.save(); c.scale(1, o);
  c.shadowColor = 'rgba(190,220,90,0.35)'; c.shadowBlur = 8; c.fillStyle = '#000'; almond(); c.fill(); c.shadowBlur = 0;
  almond(); c.clip();
  const ig = c.createRadialGradient(0, 0, 1, 0, 0, 15);
  ig.addColorStop(0, '#eaf8a6'); ig.addColorStop(0.45, '#b4dc50'); ig.addColorStop(0.85, '#5f9c2a'); ig.addColorStop(1, '#2c5412');
  c.fillStyle = ig; c.fillRect(-16, -14, 32, 28);
  const lg = c.createLinearGradient(0, -12, 0, 6);          // shadow from the upper lid
  lg.addColorStop(0, 'rgba(0,0,0,0.75)'); lg.addColorStop(0.45, 'rgba(0,0,0,0)');
  c.fillStyle = lg; c.fillRect(-16, -14, 32, 22);
  c.strokeStyle = 'rgba(70,95,20,0.5)'; c.lineWidth = 0.6;  // iris fibres
  for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2; c.beginPath(); c.moveTo(Math.cos(a) * 3.6, Math.sin(a) * 6); c.lineTo(Math.cos(a) * 11, Math.sin(a) * 9); c.stroke(); }
  c.fillStyle = '#050703'; c.beginPath(); c.ellipse(0.5, 0, 2.7, 8.6, 0, 0, Math.PI * 2); c.fill();   // slit pupil
  c.restore();
  c.save(); c.scale(1, o);
  c.strokeStyle = 'rgba(0,0,0,0.95)'; c.lineWidth = 1.8; almond(); c.stroke();
  c.restore();
  if (open > 0.5) {                                          // catchlights
    c.fillStyle = `rgba(255,255,255,${0.9 * open})`; c.beginPath(); c.ellipse(-4.2, -3, 2.1, 1.6, -0.5, 0, Math.PI * 2); c.fill();
    c.fillStyle = `rgba(255,255,255,${0.35 * open})`; c.beginPath(); c.arc(4, 2.6, 1, 0, Math.PI * 2); c.fill();
  }
  c.restore();
}

function frame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  const br = 1 + Math.sin(t * 1.7) * 0.004;                  // slow breathing
  ctx.setTransform(K, 0, 0, K * br, 0, 396 * K * (1 - br));
  ctx.drawImage(cache, 0, 0, LW, LH);
  const b = (t + 1.2) % 5.3;                                 // blink every ~5 s, now and then a slow sleepy half-close
  let open = 1;
  if (b > 5.05) open = Math.abs(Math.cos((b - 5.05) / 0.25 * Math.PI / 2));
  else if (Math.floor((t + 1.2) / 5.3) % 3 === 2 && b > 2 && b < 3.4) open = 0.72 + 0.28 * Math.abs(Math.cos((b - 2) / 1.4 * Math.PI));
  eye(ctx, 133, 101, false, open);
  eye(ctx, 187, 101, true, open);
}

// ====================================================================================
// Side-view walking cat (for arriving and leaving). Same fur/lighting style as the sitting cat.
// ====================================================================================
const SW = 1.1;                                              // on-screen scale of the walker
const WTOP = 34;                                             // headroom for the raised tail
const WLW = 340, WLH = 200 + WTOP, WG = 170;                        // logical canvas size and ground line
const wv = document.getElementById('w');
const WK = SW * dpr;
wv.width = Math.round(WLW * WK); wv.height = Math.round(WLH * WK);
wv.style.width = WLW * SW + 'px'; wv.style.height = WLH * SW + 'px';
wv.style.bottom = -((WLH - WG - WTOP) * SW - 9) + 'px';      // her paws line up with where the sitting cat's shadow is
const wctx = wv.getContext('2d');

const WL = { x: 235, y: 30 };                                // light for the walker (upper front)
const wlit = (x, y) => Math.pow(clamp(1 - Math.hypot(x - WL.x, y - WL.y) / 260), 1.3);
function wfur(c, path, box, count, angle, o) {
  c.save(); c.clip(path); c.lineCap = 'round';
  for (let i = 0; i < count; i++) {
    const x = box[0] + rnd() * box[2], y = box[1] + rnd() * box[3];
    const a = angle(x, y) + (rnd() - 0.5) * 0.3, len = o.len[0] + rnd() * (o.len[1] - o.len[0]);
    const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len, l = wlit(x, y);
    c.strokeStyle = rnd() < o.light * (0.3 + l) ? `rgba(${TINT},${(0.05 + rnd() * 0.15 * o.glint) * (0.3 + l * 1.5)})` : `rgba(0,0,0,${0.12 + rnd() * 0.28})`;
    c.lineWidth = 0.45 + rnd() * 0.45;
    c.beginPath(); c.moveTo(x, y); c.lineTo(ex, ey); c.stroke();
  }
  c.restore();
}

const wBody = P('M72,88 C70,70 90,61 120,60 C150,58 180,58 205,63 C222,66 230,80 227,93 C224,108 208,118 190,116 C170,111 150,114 130,112 C108,114 82,112 74,100 Z');
const wNeck = P('M198,64 C214,56 228,50 240,48 L248,84 C238,92 228,98 218,102 L204,98 Z');
const wHead = P('M228,68 C226,50 240,40 257,42 C273,44 283,56 283,66 C285,75 279,83 267,85 C254,89 236,86 228,68 Z');
const wEarN = P('M238,50 C238,40 240,30 244,22 C250,28 256,34 258,43 Z');
const wEarF = P('M254,43 C258,34 264,28 269,24 C270,32 271,40 270,49 Z');
const wCache = document.createElement('canvas');
wCache.width = wv.width; wCache.height = wv.height;

function paintWalkStatic(c) {
  c.setTransform(WK, 0, 0, WK, 0, WTOP * WK);
  let g;
  pool(c, 165, WG + 2, 140, 12, 0.5);                        // soft shadow along the ground
  pool(c, 165, WG, 95, 5, 0.7);

  // far ear
  g = c.createLinearGradient(0, 24, 0, 50); g.addColorStop(0, '#15161b'); g.addColorStop(1, '#050506');
  c.fillStyle = g; c.fill(wEarF);
  // torso, neck
  g = c.createLinearGradient(0, 58, 0, 118);
  g.addColorStop(0, '#22232a'); g.addColorStop(0.3, '#0c0c0f'); g.addColorStop(1, '#030304');
  c.fillStyle = g; c.fill(wBody); c.fill(wNeck);
  const back = () => Math.atan2(0.28, -1);                   // fur lies back along the body
  wfur(c, wBody, [66, 56, 166, 64], 2300, back, { len: [6, 11], light: 0.65, glint: 0.6 });
  wfur(c, wNeck, [196, 46, 54, 60], 520, () => Math.atan2(0.9, -0.5), { len: [5, 9], light: 0.65, glint: 0.6 });
  // belly shadow and a sheen along the spine
  g = c.createLinearGradient(0, 96, 0, 118); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
  c.save(); c.clip(wBody); c.fillStyle = g; c.fillRect(60, 90, 180, 34); c.restore();
  g = c.createLinearGradient(80, 0, 215, 0);
  g.addColorStop(0, 'rgba(160,168,190,0)'); g.addColorStop(0.6, 'rgba(160,168,190,0.25)'); g.addColorStop(1, 'rgba(160,168,190,0.05)');
  c.strokeStyle = g; c.lineWidth = 2; c.lineCap = 'round';
  c.beginPath(); c.moveTo(88, 66); c.bezierCurveTo(120, 62, 170, 60, 204, 66); c.stroke();

  // head
  g = c.createRadialGradient(250, 52, 3, 258, 66, 36);
  g.addColorStop(0, '#26272e'); g.addColorStop(0.55, '#0d0d10'); g.addColorStop(1, '#040405');
  c.fillStyle = g; c.fill(wHead);
  wfur(c, wHead, [226, 40, 60, 50], 700, () => Math.atan2(0.5, -1), { len: [4, 8], light: 0.7, glint: 0.8 });
  // near ear
  g = c.createLinearGradient(236, 22, 252, 50); g.addColorStop(0, '#24252c'); g.addColorStop(1, '#070708');
  c.fillStyle = g; c.fill(wEarN);
  c.fillStyle = '#2a1a1f'; c.beginPath(); c.moveTo(241, 46); c.lineTo(245, 30); c.lineTo(254, 43); c.closePath(); c.fill();
  // rim light along the top of the head, ears and back
  g = c.createLinearGradient(80, 20, 290, 70);
  g.addColorStop(0, 'rgba(170,180,205,0.08)'); g.addColorStop(0.7, 'rgba(170,180,205,0.5)'); g.addColorStop(1, 'rgba(170,180,205,0.35)');
  c.strokeStyle = g; c.lineWidth = 1.3; c.lineJoin = 'round';
  c.stroke(wEarN); c.stroke(wBody);

  // eyes (a three-quarter profile: near eye full, far eye narrower), nose, mouth, whiskers
  const wEye = (cx, cy, w, h) => {
    c.save(); c.translate(cx, cy);
    c.shadowColor = 'rgba(190,220,90,0.4)'; c.shadowBlur = 6;
    const alm = () => { c.beginPath(); c.moveTo(-w, 1.4); c.quadraticCurveTo(0, -h * 1.5, w, -0.8); c.quadraticCurveTo(0, h * 1.2, -w, 1.4); c.closePath(); };
    c.fillStyle = '#000'; alm(); c.fill(); c.shadowBlur = 0; c.save(); alm(); c.clip();
    const ig = c.createRadialGradient(0, 0, 0.5, 0, 0, w * 1.1);
    ig.addColorStop(0, '#eaf8a6'); ig.addColorStop(0.5, '#b4dc50'); ig.addColorStop(0.9, '#5f9c2a'); ig.addColorStop(1, '#2c5412');
    c.fillStyle = ig; c.fillRect(-w, -h * 2, w * 2, h * 4);
    const lg = c.createLinearGradient(0, -h, 0, h * 0.5); lg.addColorStop(0, 'rgba(0,0,0,0.7)'); lg.addColorStop(0.5, 'rgba(0,0,0,0)');
    c.fillStyle = lg; c.fillRect(-w, -h * 2, w * 2, h * 3);
    c.fillStyle = '#050703'; c.beginPath(); c.ellipse(0.3, 0, w * 0.2, h * 1.05, 0, 0, Math.PI * 2); c.fill();
    c.restore(); c.strokeStyle = 'rgba(0,0,0,0.95)'; c.lineWidth = 1.2; alm(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.9)'; c.beginPath(); c.ellipse(-w * 0.35, -h * 0.4, w * 0.18, h * 0.22, -0.5, 0, Math.PI * 2); c.fill();
    c.restore();
  };
  wEye(266, 57, 6.6, 4.2); wEye(277, 57, 4.2, 3.6);
  c.fillStyle = '#3d2f35'; c.beginPath(); c.moveTo(280, 64); c.lineTo(285, 66); c.lineTo(282, 70); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.6)'; c.lineWidth = 0.9; c.lineCap = 'round';
  c.beginPath(); c.moveTo(282, 70); c.quadraticCurveTo(279, 76, 272, 76); c.stroke();
  c.lineWidth = 0.6;
  for (const [dy, ex, ey] of [[0, 308, 60], [3, 311, 68], [6, 306, 77]]) {
    const wg = c.createLinearGradient(277, 70 + dy, ex, ey); wg.addColorStop(0, 'rgba(225,228,238,0.5)'); wg.addColorStop(1, 'rgba(225,228,238,0.03)');
    c.strokeStyle = wg; c.beginPath(); c.moveTo(277, 70 + dy); c.quadraticCurveTo((277 + ex) / 2, (70 + ey) / 2 - 6, ex, ey); c.stroke();

}
paintWalkStatic(wCache.getContext('2d'));

// ---- gait: leg phase follows distance travelled, so paws never slide on the ground ----
const STRIDE = 19, DUTY = 0.62, CYCLE = 2 * STRIDE / DUTY;
const GPH = { nearHind: 0, nearFront: 0.25, farHind: 0.5, farFront: 0.75 };
function wfoot(hipX, phase, d) {
  const p = (((d / CYCLE) + phase) % 1 + 1) % 1;
  if (p < DUTY) return { x: hipX + STRIDE - (p / DUTY) * 2 * STRIDE, y: WG };
  const u = (p - DUTY) / (1 - DUTY);
  return { x: hipX - STRIDE + 2 * STRIDE * u, y: WG - 12 * Math.sin(Math.PI * u) };
}
function ik(ax, ay, tx, ty, l1, l2, dir) {
  let d = Math.hypot(tx - ax, ty - ay); d = Math.min(d, l1 + l2 - 0.01);
  const base = Math.atan2(ty - ay, tx - ax);
  const a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const ang = base + dir * a;
  return { x: ax + Math.cos(ang) * l1, y: ay + Math.sin(ang) * l1 };
}
const W_RIM = 'rgba(120,125,140,0.5)';
function wlimb(c, pts, widths, col) {
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (const [stroke, extra] of [[W_RIM, 1.5], [col, 0]]) {
    c.strokeStyle = stroke;
    for (let i = 0; i < pts.length - 1; i++) { c.lineWidth = widths[i] + extra; c.beginPath(); c.moveTo(pts[i].x, pts[i].y); c.lineTo(pts[i + 1].x, pts[i + 1].y); c.stroke(); }
  }
}
function wpaw(c, f, col) { c.fillStyle = col; c.beginPath(); c.ellipse(f.x + 3, f.y - 2.5, 7, 4, 0, 0, Math.PI * 2); c.fill(); }
function wFront(c, phase, d, col, near) {
  const sh = { x: 198 - (near ? 0 : 6), y: 98 }, f = wfoot(sh.x + 8, phase, d), wrist = { x: f.x - 1, y: f.y - 11 };
  wlimb(c, [sh, ik(sh.x, sh.y, wrist.x, wrist.y, 32, 28, +1), wrist, { x: f.x, y: f.y - 3 }], [13, 8, 6], col); wpaw(c, f, col);
}
function wHind(c, phase, d, col, near) {
  const hp = { x: 100 + (near ? 0 : 6), y: 96 }, f = wfoot(hp.x - 4, phase, d), hock = { x: f.x - 5, y: f.y - 17 };
  wlimb(c, [hp, ik(hp.x, hp.y, hock.x, hock.y, 33, 29, -1), hock, { x: f.x, y: f.y - 3 }], [16, 9, 6, 6], col); wpaw(c, f, col);
}
function wTail(c, t, bob, wag) {
  const N = 13, L = 7;
  let x = 76, y = 84 + bob, a = -Math.PI / 2 - 0.55 + Math.sin(t * 4.2) * 0.1 * wag;   // up and slightly back, swaying
  const pts = [{ x, y }];
  for (let i = 0; i < N; i++) {
    a += 0.1 + Math.sin(t * 4.2 - i * 0.5) * 0.085 * wag * (0.3 + i / N);
    x += Math.cos(a) * L; y += Math.sin(a) * L; pts.push({ x, y });
  }
  wlimb(c, pts, pts.slice(1).map((_, i) => 8.5 - (i / N) * 3.6), '#060608');
}
function muscle(c, cx, cy, rx, ry, rot) {
  const g = c.createRadialGradient(cx - 3, cy - 5, 1, cx, cy, Math.max(rx, ry)); g.addColorStop(0, '#131316'); g.addColorStop(1, '#060607');
  c.globalAlpha = 0.55; c.fillStyle = g; c.beginPath(); c.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); c.fill(); c.globalAlpha = 1;
}

function drawWalker(t, d, walking) {
  const c = wctx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, wv.width, wv.height);
  const bob = walking ? Math.cos(d / CYCLE * Math.PI * 4) * 1.1 : 0;
  c.setTransform(WK, 0, 0, WK, 0, WTOP * WK);
  wFront(c, GPH.farFront, d, '#0d0d10', false);
  wHind(c, GPH.farHind, d, '#0d0d10', false);
  wTail(c, t, bob, 1);
  c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(wCache, 0, bob * WK);   // torso, neck and head (bobbing)
  c.setTransform(WK, 0, 0, WK, 0, WTOP * WK);
  muscle(c, 100, 96 + bob, 17, 22, 0.3); muscle(c, 196, 96 + bob, 12, 18, -0.15);
  wFront(c, GPH.nearFront, d, '#060608', true);
  wHind(c, GPH.nearHind, d, '#060608', true);
}

// ====================================================================================
// Choreography: she walks in, sits down; when told to leave she stands, turns and walks away.
// ====================================================================================
const REST = 22;
const SITW = LW * SCALE, WALKW = WLW * SW;
const sitCx = REST + SITW / 2;                               // x of her centre while sitting
const smooth = u => u * u * (3 - 2 * u);
const sleep = ms => new Promise(r => setTimeout(r, ms));
cv.style.left = REST + 'px';

let walker = { x: -WALKW, dir: 1, d: 0, t: 0, walking: false, alpha: 0 };   // x = centre
let sitAlpha = 0, sitStretch = 1, now_t = 0;

function applyWalker() {
  wv.style.opacity = walker.alpha;
  wv.style.transform = `translateX(${walker.x - WALKW / 2}px) scaleX(${walker.dir})`;
}
function applySit() { cv.style.opacity = sitAlpha; cv.style.transformOrigin = '50% 100%'; cv.style.transform = `scale(${1 / sitStretch}, ${sitStretch})`; }

// walk from x0 to x1 at `speed` px/s, easing in and/or out; resolves on arrival
function walkTo(x1, speed, easeIn, easeOut) {
  return new Promise(res => {
    const x0 = walker.x, dist = Math.abs(x1 - x0), sign = Math.sign(x1 - x0) || 1;
    walker.dir = sign; walker.walking = true;
    let last = performance.now(), covered = 0;
    (function step(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const left = dist - covered;
      let v = speed;
      if (easeIn) v *= clamp(covered / 70 + 0.15);            // start slowly, as she gets going
      if (easeOut) v *= clamp(left / 90 + 0.06);              // slow down as she arrives
      const dx = Math.min(left, v * dt);
      covered += dx; walker.x = x0 + sign * covered; walker.d += dx / SW;
      applyWalker();
      if (covered < dist - 0.01) requestAnimationFrame(step); else { walker.walking = false; res(); }
    })(last);
  });
}
function fade(setter, from, to, ms) {
  return new Promise(res => {
    const t0 = performance.now();
    (function step(now) {
      const u = clamp((now - t0) / ms); setter(from + (to - from) * smooth(u));
      if (u < 1) requestAnimationFrame(step); else res();
    })(t0);
  });
}

window.catEnter = async () => {
  walker.x = -WALKW / 2 - 10; walker.alpha = 1; walker.dir = 1; walker.d = 0; applyWalker();
  await walkTo(sitCx, 95, false, true);                       // walks in from the left and slows to a stop
  await Promise.all([fade(a => { walker.alpha = a; applyWalker(); }, 1, 0, 450), fade(a => { sitAlpha = a; applySit(); }, 0, 1, 450)]);
  await fade(u => { sitStretch = 1 - 0.05 * Math.sin(Math.PI * u); applySit(); }, 0, 1, 380);   // settles down
  sitStretch = 1; applySit();
};
window.catLeave = async () => {
  walker.x = sitCx; walker.dir = -1; walker.d = 0; walker.walking = false; applyWalker();
  await fade(u => { sitStretch = 1 + 0.05 * u; applySit(); }, 0, 1, 260);                       // rises
  await Promise.all([fade(a => { sitAlpha = a; applySit(); }, 1, 0, 380), fade(a => { walker.alpha = a; applyWalker(); }, 0, 1, 380)]);
  sitStretch = 1;
  await walkTo(-WALKW / 2 - 20, 100, true, false);            // turns away and walks off, tail swaying
  walker.alpha = 0; applyWalker();
};

// ---------- main loop ----------
function loop(now) {
  const t = (now - t0) / 1000; now_t = t;
  if (walker.alpha > 0.001) drawWalker(t, walker.d, walker.walking);
  if (sitAlpha > 0.001) frame(t);
  requestAnimationFrame(loop);
}
const t0 = performance.now();
if (freeze !== null) {
  if (q.get('pose') === 'walk') { walker.x = 200; walker.dir = 1; walker.alpha = 1; walker.d = freeze * 40; walker.walking = true; applyWalker(); drawWalker(freeze, walker.d, true); }
  else { sitAlpha = 1; applySit(); frame(freeze); }
} else {
  requestAnimationFrame(loop);
  window.catEnter();
}
</script>
