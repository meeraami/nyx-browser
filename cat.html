<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; overflow: hidden; }
  canvas { position: absolute; bottom: 0; left: -44px; display: block; opacity: 0; transform-origin: 50% 100%; }
</style>
<div id="stage"><canvas id="c"></canvas></div>
<script>
// A real black cat (cat.png, a transparent cut-out) resting on the window, with a ground shadow, slow breathing and blinking.
// If cat.png is missing nothing is shown. ?freeze=<seconds> draws one still frame without fading (for testing).
const q = new URLSearchParams(location.search);
const DISPLAY_H = +q.get('h') || 130;                        // on-screen height of the cat, in CSS px
const freeze = q.has('freeze') ? +q.get('freeze') : null;
const dpr = window.devicePixelRatio || 1;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = u => u * u * (3 - 2 * u);

// where the eyes are in cat.png (pixels), used to draw the eyelids for blinking
const EYES = [{ x: 174, y: 150 }, { x: 265, y: 148 }], EYE_RX = 21, EYE_RY = 13;

const darkMQ = matchMedia('(prefers-color-scheme: dark)');   // the overlay follows the browser's theme setting
const img = new Image();
let ready = false, S = 1, PAD_X = 130, PAD_R = 70, PAD_B = 22, W = 0, H = 0, readyResolve;   // PAD_X leaves room on the left for her tail
const loaded = new Promise(r => (readyResolve = r));
img.onload = () => {
  S = DISPLAY_H / img.naturalHeight;
  W = Math.round(img.naturalWidth * S + PAD_X + PAD_R); H = Math.round(DISPLAY_H + PAD_B + 6);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ready = true; readyResolve();
};
img.onerror = () => { ready = false; readyResolve(); };
img.src = 'cat.png';

function pool(cx, cy, rx, ry, a) {                           // soft elliptical shadow on the floor
  const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, rx);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(0.55, `rgba(0,0,0,${a * 0.4})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.translate(cx, cy); ctx.scale(1, ry / rx); ctx.translate(-cx, -cy);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, rx, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}

// A glossy black tail that matches her coat. The photo hides her real one, so this lies along the floor behind her haunch and wags.
const tailSeed = Array.from({ length: 1200 }, (_, i) => { let x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); });
function tail(t, floor) {
  const KS = DISPLAY_H / 150, N = 20, L = 5.2 * KS, wag = 1, wf = darkMQ.matches ? 1 : 0.9;
  let x = PAD_X + 84 * S, y = floor - 92 * S, a = Math.PI - 0.5;                     // starts behind the haunch, heading left and down to the floor
  const pts = [{ x, y }], widths = [15 * KS * wf];
  for (let i = 0; i < N; i++) {
    const curl = i < 4 ? 0.08 : i < 12 ? 0.014 : 0.12;                                  // eases down onto the floor, runs along it, then the tip lifts
    a += curl + Math.sin(t * 3.3 - i * 0.3) * 0.16 * wag * (0.1 + i / N);            // the wag runs up the tail as a wave
    x += Math.cos(a) * L; y = Math.min(floor - 0.5, y + Math.sin(a) * L); pts.push({ x, y }); widths.push((15 + 4.5 * Math.sin(Math.PI * Math.min(1, (i + 1) / (N * 0.8))) - (i / N) * 6) * KS * wf);
  }
  const n = pts.length, Lp = [], Rp = [];
  for (let i = 0; i < n; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(n - 1, i + 1)];
    let dx = p1.x - p0.x, dy = p1.y - p0.y; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
    Lp.push({ x: pts[i].x - dy * widths[i] / 2, y: pts[i].y + dx * widths[i] / 2 });
    Rp.push({ x: pts[i].x + dy * widths[i] / 2, y: pts[i].y - dx * widths[i] / 2 });
  }
  const tip = { x: pts[n - 1].x + Math.cos(a) * 2.4, y: pts[n - 1].y + Math.sin(a) * 2.4 };
  const ring = [...Lp, tip, ...Rp.reverse()];
  ctx.save();
  pool(pts[Math.floor(n / 2)].x, floor + 1, 40, 4, 0.45);                              // contact shadow under the tail
  const dk = darkMQ.matches;
  if (dk) { ctx.save(); ctx.filter = 'blur(2.6px)'; ctx.strokeStyle = dk ? 'rgba(6,6,9,0.5)' : 'rgba(6,6,9,0.22)'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 0; i < n - 1; i++) { ctx.lineWidth = widths[i] + (dk ? 6 : 2.6); ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[i + 1].x, pts[i + 1].y); ctx.stroke(); }
  ctx.restore(); }                                                                     // (the halo above makes the outline fuzzy; dark pages only)
  if (!dk) {                                                                           // light page: stacked, slightly wider, blurred copies give a gradual, irregular fur falloff
    const polyPath = wArr => {
      const A = [], B = [];
      for (let i = 0; i < n; i++) {
        const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(n - 1, i + 1)];
        let dx = p1.x - p0.x, dy = p1.y - p0.y; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
        A.push({ x: pts[i].x - dy * wArr[i] / 2, y: pts[i].y + dx * wArr[i] / 2 }); B.push({ x: pts[i].x + dy * wArr[i] / 2, y: pts[i].y - dx * wArr[i] / 2 });
      }
      const r2 = [...A, tip, ...B.reverse()];
      ctx.beginPath(); ctx.moveTo((r2[0].x + r2[1].x) / 2, (r2[0].y + r2[1].y) / 2);
      for (let i = 1; i < r2.length; i++) { const p = r2[i], q3 = r2[(i + 1) % r2.length]; ctx.quadraticCurveTo(p.x, p.y, (p.x + q3.x) / 2, (p.y + q3.y) / 2); }
      ctx.closePath();
    };
    ctx.filter = 'blur(0.8px)'; ctx.fillStyle = 'rgba(6,6,9,0.15)';
    for (let Ly = 0; Ly < 7; Ly++) { polyPath(widths.map((w, i) => w / wf * (1 + 0.035 * (Ly + 1)) * (1 + (tailSeed[(i * 7 + Ly * 13) % 1200] - 0.5) * 0.1))); ctx.fill(); }
  }
  ctx.filter = dk ? 'blur(0.8px)' : 'blur(0.5px)';                                      // as soft as the photograph, but crisper on a light page
  ctx.beginPath(); ctx.moveTo((ring[0].x + ring[1].x) / 2, (ring[0].y + ring[1].y) / 2);
  for (let i = 1; i < ring.length; i++) { const p = ring[i], q2 = ring[(i + 1) % ring.length]; ctx.quadraticCurveTo(p.x, p.y, (p.x + q2.x) / 2, (p.y + q2.y) / 2); }
  ctx.closePath();
  const g = ctx.createLinearGradient(0, floor - 40, 0, floor);
  g.addColorStop(0, '#16161a'); g.addColorStop(0.5, '#08080b'); g.addColorStop(1, '#030304');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = dk ? 'rgba(140,150,176,0.16)' : 'rgba(140,150,176,0.07)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';   // sheen along the top edge, like the coat
  ctx.beginPath(); ctx.moveTo(Lp[1].x, Lp[1].y); for (let i = 2; i < n; i++) ctx.lineTo(Lp[i].x, Lp[i].y); ctx.stroke();
  // fluff: many fine, short strands lying along the tail (swept towards the tip), a soft plume at the end.
  // On a light page dark spikes read like cactus needles, so there they are shorter, finer, fainter and lie closer to the tail.
  ctx.lineCap = 'round';
  if (!dk) {                                                                           // light page: just a few fine, curved flyaway hairs lying along the tail
    ctx.filter = 'blur(0.3px)';
    for (let k = 0; k < 26; k++) {
      const r = j => tailSeed[(300 + k * 7 + j) % 1200];
      const i = 1 + Math.floor(r(0) * (n - 3)), sd = r(1) < 0.5 ? Lp : Rp, out = sd === Lp ? 1 : -1, p = sd[i];
      const ang = Math.atan2(pts[i + 1].y - pts[i - 1].y, pts[i + 1].x - pts[i - 1].x), len = (7 + r(2) * 9) * KS, bow = (1 + r(3) * 2.2) * KS * out;
      const ox = Math.cos(ang + Math.PI / 2) * -out, oy = Math.sin(ang + Math.PI / 2) * -out;
      const ex = p.x + Math.cos(ang) * len + ox * 1.2 * KS * r(2), ey = p.y + Math.sin(ang) * len + oy * 1.2 * KS * r(2);
      ctx.strokeStyle = `rgba(6,6,9,${0.22 + 0.2 * r(4)})`; ctx.lineWidth = 0.45;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.quadraticCurveTo((p.x + ex) / 2 + ox * bow, (p.y + ey) / 2 + oy * bow, ex, ey); ctx.stroke();
    }
    ctx.filter = 'none';
  }
  const sweepMin = dk ? 0.3 : 0.14, sweepVar = dk ? 0.55 : 0.32, lenK = dk ? 1 : 0.72, aDark = dk ? 0.62 : 0.4, wMin = dk ? 0.45 : 0.32, wVar = dk ? 0.4 : 0.22;
  if (dk) for (let i = 1; i < n; i++) for (let sd = 0; sd < 2; sd++) for (let k = 0; k < 8; k++) {
    const r = j => tailSeed[(i * 48 + sd * 24 + k * 3 + j) % 1200];
    const p = (sd ? Rp : Lp)[i], ang = Math.atan2(pts[Math.min(n - 1, i + 1)].y - pts[i - 1].y, pts[Math.min(n - 1, i + 1)].x - pts[i - 1].x);
    const a2 = ang + (sd ? -1 : 1) * (sweepMin + r(0) * sweepVar), len = (2.6 + r(2) * 4.2) * (0.75 + 0.45 * widths[i] / (15 * KS * wf)) * KS * lenK;
    const along = (k - 3.5) * 0.9, inset = r(1) * 3 * KS;
    const sx = p.x + Math.cos(ang) * along - Math.cos(ang + (sd ? -Math.PI / 2 : Math.PI / 2)) * inset, sy = p.y + Math.sin(ang) * along - Math.sin(ang + (sd ? -Math.PI / 2 : Math.PI / 2)) * inset;
    ctx.strokeStyle = r(1) < 0.22 ? `rgba(150,160,185,${dk ? 0.2 : 0.04})` : `rgba(6,6,9,${aDark})`;
    ctx.lineWidth = wMin + r(2) * wVar;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(a2) * len, sy + Math.sin(a2) * len); ctx.stroke();
  }
  for (let k = 0; k < (dk ? 28 : 8); k++) {                                            // a soft plume at the tip
    const r = j => tailSeed[(700 + k * 5 + j) % 1200], t0 = pts[n - 1];
    const a3 = a + (r(0) - 0.5) * (dk ? 1.5 : 0.7), len = (3 + r(1) * 5) * KS * (dk ? 1 : 0.8), off = (r(2) - 0.5) * (dk ? 6 : 5) * KS;
    ctx.strokeStyle = r(3) < 0.2 ? `rgba(150,160,185,${dk ? 0.18 : 0.04})` : `rgba(6,6,9,${dk ? 0.62 : 0.3})`; ctx.lineWidth = (0.5 + r(4) * 0.4) * (dk ? 1 : 0.7);
    ctx.beginPath(); ctx.moveTo(t0.x - Math.sin(a) * off, t0.y + Math.cos(a) * off); ctx.lineTo(t0.x - Math.sin(a) * off + Math.cos(a3) * len, t0.y + Math.cos(a) * off + Math.sin(a3) * len); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(140,150,176,0.09)'; ctx.lineWidth = 0.5;                    // fine fur texture inside the tail (dark pages only; on white it reads as dashes)
  if (dk) for (let i = 1; i < n - 1; i++) for (let k = 0; k < 4; k++) {
    const r = j => tailSeed[(i * 12 + k * 3 + j + 450) % 1200], p0 = pts[i], off = (r(0) - 0.5) * widths[i] * 0.75;
    const ang = Math.atan2(pts[i + 1].y - pts[i - 1].y, pts[i + 1].x - pts[i - 1].x);
    const cx0 = p0.x - Math.sin(ang) * off, cy0 = p0.y + Math.cos(ang) * off;
    ctx.beginPath(); ctx.moveTo(cx0, cy0); ctx.lineTo(cx0 + Math.cos(ang) * 4, cy0 + Math.sin(ang) * 4); ctx.stroke();
  }
  ctx.restore();
}

function frame(t) {
  if (!ready) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const floor = H - PAD_B + 4, iw = img.naturalWidth * S, cx = PAD_X + iw / 2;
  const dark = darkMQ.matches, k = dark ? 1 : 1.55;           // on a light page the shadow has to carry more weight
  // 1) wide soft pool plus a cast shadow thrown to the right (light from the upper left)
  pool(cx, floor - 1, iw * 0.9, 14, Math.min(0.95, 0.5 * k));
  pool(cx + iw * 0.12, floor, iw * 0.78, 9, Math.min(0.95, 0.4 * k));
  tail(t, floor);                                            // behind her, so the haunch covers its base
  // 2) the cat, with her paws pressed a few pixels into the shadow
  const br = 1 + Math.sin(t * 1.8) * 0.0045;                 // slow breathing, anchored at the floor
  ctx.save(); ctx.translate(cx, floor); ctx.scale(1, br); ctx.translate(-cx, -floor);
  ctx.drawImage(img, PAD_X, floor + 3 - DISPLAY_H, iw, DISPLAY_H);
  // darken the lowest part of her body, so the paws sink into the floor instead of hovering above it
  ctx.globalCompositeOperation = 'source-atop';
  const og = ctx.createLinearGradient(0, floor - 26, 0, floor + 4);
  og.addColorStop(0, 'rgba(0,0,0,0)'); og.addColorStop(1, `rgba(0,0,0,${dark ? 0.55 : 0.7})`);
  ctx.fillStyle = og; ctx.fillRect(0, floor - 26, W, 36);
  ctx.globalCompositeOperation = 'source-over';
  // 3) tight contact shadow drawn over the paws' bottom edge: this is what makes her sit on the ground
  pool(cx, floor + 1, iw * 0.5, 6.5, Math.min(0.97, 0.85 * (dark ? 1 : 1.15)));
  pool(cx - iw * 0.18, floor + 1, iw * 0.24, 5, 0.6 * (dark ? 1 : 1.2));
  // blink: a feathered, fur-coloured eyelid closes over each eye
  const b = (t + 1.5) % 5.6;
  let closed = 0;
  if (b > 5.3) closed = Math.sin((b - 5.3) / 0.3 * Math.PI);
  else if (Math.floor((t + 1.5) / 5.6) % 3 === 2 && b > 2.2 && b < 3.6) closed = 0.55 * Math.sin((b - 2.2) / 1.4 * Math.PI);   // an occasional slow, sleepy half-close
  if (closed > 0.02) for (const e of EYES) {
    const ex = PAD_X + e.x * S, ey = floor - DISPLAY_H + e.y * S, rx = EYE_RX * S, ry = EYE_RY * S * 1.15 * closed;
    ctx.save(); ctx.translate(ex, ey - EYE_RY * S * (1 - closed) * 0.9); ctx.scale(1, ry / rx);   // the lid comes down from above
    const g = ctx.createRadialGradient(0, 0, rx * 0.35, 0, 0, rx);
    g.addColorStop(0, 'rgba(11,11,14,1)'); g.addColorStop(0.7, 'rgba(11,11,14,0.96)'); g.addColorStop(1, 'rgba(11,11,14,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx * 1.12, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

// ---- arriving and leaving: she fades in and settles, and fades out when it is time to go ----
function show(on, ms) {
  return new Promise(res => {
    cv.style.transition = `opacity ${ms}ms ease, transform ${ms}ms ease`;
    cv.style.opacity = on ? 1 : 0;
    cv.style.transform = on ? 'translateY(0) scale(1)' : 'translateY(6px) scale(0.97)';
    setTimeout(res, ms);
  });
}
window.catEnter = async () => { await loaded; if (!ready) return; cv.style.transition = 'none'; cv.style.transform = 'translateY(10px) scale(0.97)'; cv.offsetHeight; await show(true, 1600); };
window.catLeave = async () => { await loaded; await show(false, 1400); };

const t0 = performance.now();
if (freeze === null) (function loop(now) { frame((now - t0) / 1000); requestAnimationFrame(loop); })(t0);
loaded.then(() => { if (freeze !== null) { cv.style.opacity = 1; frame(freeze); } else window.catEnter(); });
</script>
