<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Nyx</title>
  <link rel="icon" href="icon.png" />
  <style>
    :root { --bg: #1f1f23; --card: #2b2b31; --line: #3a3a42; --hover: #36363d; --text: #e8e8ea; --dim: #9a9aa2; --accent: #8b6cff; --danger: #ff6b6b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px "Segoe UI", sans-serif; display: flex; min-height: 100vh; }
    nav { width: 220px; flex: none; padding: 24px 12px; border-right: 1px solid var(--line); }
    nav .brand { display: flex; align-items: center; gap: 10px; padding: 0 12px 22px; font-size: 20px; font-weight: 600; }
    nav .brand img { width: 30px; height: 30px; }
    nav a { display: block; padding: 9px 12px; border-radius: 8px; color: var(--text); text-decoration: none; margin-bottom: 2px; }
    nav a:hover { background: var(--hover); }
    nav a.active { background: var(--card); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
    main { flex: 1; padding: 28px 40px; max-width: 900px; }
    h1 { margin: 0 0 20px; font-size: 24px; font-weight: 600; }
    h2 { margin: 28px 0 10px; font-size: 15px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
    .card { background: var(--card); border-radius: 10px; padding: 4px 18px; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: none; }
    .row .grow { flex: 1; min-width: 0; }
    .row .sub { color: var(--dim); font-size: 12px; margin-top: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    input[type=text], input[type=search], select { height: 32px; padding: 0 10px; border: 1px solid #4a4a52; border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; outline: none; }
    input[type=text]:focus, input[type=search]:focus, select:focus { border-color: var(--accent); }
    input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; }
    label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    button { height: 32px; padding: 0 14px; border: none; border-radius: 6px; background: var(--hover); color: var(--text); font: inherit; cursor: pointer; flex: none; }
    button:hover { background: #44444c; }
    button.primary { background: var(--accent); color: #fff; }
    button.danger { color: var(--danger); }
    button.icon { width: 30px; padding: 0; background: none; color: var(--dim); }
    button.icon:hover { background: var(--hover); color: var(--text); }
    .toolbar { display: flex; gap: 10px; margin-bottom: 16px; }
    .toolbar input { flex: 1; }
    .fav { width: 16px; height: 16px; flex: none; }
    .fav.none { visibility: hidden; }
    a.link { color: var(--text); text-decoration: none; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: block; }
    a.link:hover { text-decoration: underline; }
    .time { color: var(--dim); font-size: 12px; width: 64px; flex: none; }
    .empty { color: var(--dim); padding: 30px 0; text-align: center; }
    .bar { height: 4px; border-radius: 2px; background: #44444c; overflow: hidden; margin-top: 6px; }
    .bar div { height: 100%; background: var(--accent); }
    .note { color: var(--dim); font-size: 12px; margin-top: 4px; }
    .saved { color: #6fdc8c; font-size: 12px; margin-left: 8px; }
  </style>
</head>
<body>
  <nav>
    <div class="brand"><img src="icon.png" alt="" />Nyx</div>
    <a href="#settings" data-page="settings">⚙&nbsp; Settings</a>
    <a href="#history" data-page="history">🕘&nbsp; History</a>
    <a href="#bookmarks" data-page="bookmarks">☆&nbsp; Bookmarks</a>
    <a href="#downloads" data-page="downloads">⬇&nbsp; Downloads</a>
  </nav>
  <main id="main"></main>

  <script>
    const api = window.nyx;
    const main = document.getElementById('main');
    const TITLES = { settings: 'Settings', history: 'History', bookmarks: 'Bookmarks', downloads: 'Downloads' };
    let current = null;
    let refresh = () => {};

    // Small DOM helper: el('div', {className: 'x', onclick}, child, 'text', ...)
    function el(tag, props, ...kids) {
      const n = document.createElement(tag);
      Object.entries(props || {}).forEach(([k, v]) => {
        if (k === 'style') n.style.cssText = v;
        else if (k.startsWith('data-')) n.setAttribute(k, v);
        else n[k] = v;
      });
      kids.flat().forEach(k => { if (k != null && k !== false) n.append(k); });
      return n;
    }
    const fav = src => { const i = el('img', { className: 'fav' + (src ? '' : ' none'), src: src || '' }); i.onerror = () => i.classList.add('none'); return i; };
    const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
    const size = b => !b ? '0 B' : b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : b < 1073741824 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1073741824).toFixed(2) + ' GB';
    // Plain click opens here; Ctrl/middle click opens a new tab.
    function linkTo(url, text) {
      const a = el('a', { className: 'link', textContent: text, title: url });
      a.onclick = e => api.do('open', { url, newTab: e.ctrlKey });
      a.onauxclick = e => { if (e.button === 1) api.do('open', { url, newTab: true }); };
      return a;
    }

    // ---------- Settings ----------
    async function renderSettings() {
      const s = await api.get('settings');
      const set = (key, value) => api.do('settings:set', { key, value });
      const radio = (value, text) => {
        const r = el('input', { type: 'radio', name: 'startup', checked: s.startup === value });
        r.onchange = () => set('startup', value);
        return el('label', {}, r, text);
      };
      const check = (key, text) => {
        const c = el('input', { type: 'checkbox', checked: !!s[key] });
        c.onchange = () => set(key, c.checked);
        return el('label', {}, c, text);
      };

      const home = el('input', { type: 'text', value: s.homePage, style: 'width:320px' });
      const homeMsg = el('span');
      const saveHome = async () => {
        const ok = await set('homePage', home.value);
        homeMsg.className = ok ? 'saved' : 'note';
        homeMsg.textContent = ok ? 'Saved' : 'Enter a web address, e.g. google.com';
        setTimeout(() => { homeMsg.textContent = ''; }, 2500);
      };
      home.onkeydown = e => { if (e.key === 'Enter') saveHome(); };

      const engine = el('select', {}, s.engines.map(e => el('option', { value: e.id, textContent: e.name, selected: e.id === s.searchEngine })));
      engine.onchange = () => set('searchEngine', engine.value);

      const clr = { history: el('input', { type: 'checkbox', checked: true }), cookies: el('input', { type: 'checkbox' }), cache: el('input', { type: 'checkbox', checked: true }) };
      const clrMsg = el('span');
      const doClear = async () => {
        const ok = await api.do('clear-data', { history: clr.history.checked, cookies: clr.cookies.checked, cache: clr.cache.checked });
        if (ok) { clrMsg.className = 'saved'; clrMsg.textContent = 'Cleared'; setTimeout(() => { clrMsg.textContent = ''; }, 2500); }
      };

      main.replaceChildren(
        el('h1', { textContent: 'Settings' }),
        el('h2', { textContent: 'On startup' }),
        el('div', { className: 'card' },
          el('div', { className: 'row' }, radio('restore', 'Continue where you left off (reopen your tabs)')),
          el('div', { className: 'row' }, radio('home', 'Open a new tab with the home page')),
        ),
        el('h2', { textContent: 'Home page and search' }),
        el('div', { className: 'card' },
          el('div', { className: 'row' }, el('div', { className: 'grow', textContent: 'Home page (also used for new tabs)' }), home, el('button', { textContent: 'Save', onclick: saveHome }), homeMsg),
          el('div', { className: 'row' }, el('div', { className: 'grow', textContent: 'Search engine used in the address bar' }), engine),
        ),
        el('h2', { textContent: 'Appearance' }),
        el('div', { className: 'card' },
          el('div', { className: 'row' }, check('showBookmarksBar', 'Show bookmarks bar (Ctrl+Shift+B)')),
        ),
        el('h2', { textContent: 'Downloads' }),
        el('div', { className: 'card' },
          el('div', { className: 'row' },
            el('div', { className: 'grow' }, el('div', { textContent: 'Save files to' }), el('div', { className: 'sub', textContent: s.downloadDir })),
            el('button', { textContent: 'Change…', onclick: () => api.do('settings:pickFolder') })),
          el('div', { className: 'row' }, check('askDownload', 'Ask where to save each file')),
        ),
        el('h2', { textContent: 'Clear browsing data' }),
        el('div', { className: 'card' },
          el('div', { className: 'row' }, el('label', {}, clr.history, 'Browsing history')),
          el('div', { className: 'row' }, el('label', {}, clr.cache, 'Cached images and files')),
          el('div', { className: 'row' }, el('div', { className: 'grow' }, el('label', {}, clr.cookies, 'Cookies and site data'),
            el('div', { className: 'note', textContent: 'Logs you out of every site, including WhatsApp and Instagram in the sidebar.' }))),
          el('div', { className: 'row' }, el('button', { className: 'danger', textContent: 'Clear data', onclick: doClear }), clrMsg),
        ),
        el('h2', { textContent: 'About' }),
        el('div', { className: 'card' },
          el('div', { className: 'row' }, el('img', { src: 'icon.png', style: 'width:40px;height:40px' }),
            el('div', { className: 'grow' }, el('div', { textContent: `Nyx ${s.versions.nyx}` }), el('div', { className: 'sub', textContent: `Chromium ${s.versions.chrome} · Electron ${s.versions.electron}` }))),
        ),
      );
    }

    // ---------- History ----------
    function renderHistory() {
      const search = el('input', { type: 'search', placeholder: 'Search history' });
      const list = el('div');
      main.replaceChildren(
        el('h1', { textContent: 'History' }),
        el('div', { className: 'toolbar' }, search, el('button', { className: 'danger', textContent: 'Clear all history', onclick: () => api.do('history:clear') })),
        list,
      );
      refresh = async () => {
        const q = search.value.trim().toLowerCase();
        const items = (await api.get('history')).filter(h => !q || h.title.toLowerCase().includes(q) || h.url.toLowerCase().includes(q)).slice(0, 1000);
        if (!items.length) { list.replaceChildren(el('div', { className: 'empty', textContent: q ? 'No matches.' : 'No history yet.' })); return; }
        const groups = [];
        const today = new Date().toDateString();
        const yesterday = new Date(Date.now() - 864e5).toDateString();
        items.forEach(h => {
          const d = new Date(h.time).toDateString();
          if (!groups.length || groups[groups.length - 1].day !== d) groups.push({ day: d, items: [] });
          groups[groups.length - 1].items.push(h);
        });
        list.replaceChildren(...groups.map(g => [
          el('h2', { textContent: g.day === today ? 'Today' : g.day === yesterday ? 'Yesterday' : new Date(g.items[0].time).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) }),
          el('div', { className: 'card' }, g.items.map(h => el('div', { className: 'row' },
            el('span', { className: 'time', textContent: new Date(h.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }),
            fav(h.favicon),
            el('div', { className: 'grow' }, linkTo(h.url, h.title || h.url), el('div', { className: 'sub', textContent: host(h.url) })),
            el('button', { className: 'icon', textContent: '✕', title: 'Remove from history', onclick: () => api.do('history:delete', { url: h.url, time: h.time }) }),
          ))),
        ]).flat());
      };
      search.oninput = refresh;
      refresh();
    }

    // ---------- Bookmarks ----------
    function renderBookmarks() {
      const search = el('input', { type: 'search', placeholder: 'Search bookmarks' });
      const list = el('div', { className: 'card' });
      main.replaceChildren(
        el('h1', { textContent: 'Bookmarks' }),
        el('div', { className: 'toolbar' }, search),
        list,
        el('p', { className: 'note', textContent: 'Add bookmarks with the ☆ in the address bar or Ctrl+D.' }),
      );
      refresh = async () => {
        const q = search.value.trim().toLowerCase();
        const items = (await api.get('bookmarks')).filter(b => !q || b.title.toLowerCase().includes(q) || b.url.toLowerCase().includes(q));
        if (!items.length) { list.replaceChildren(el('div', { className: 'empty', textContent: q ? 'No matches.' : 'No bookmarks yet.' })); return; }
        list.replaceChildren(...items.map(b => {
          const titleBox = el('div', { className: 'grow' }, linkTo(b.url, b.title), el('div', { className: 'sub', textContent: b.url }));
          const edit = () => {
            const input = el('input', { type: 'text', value: b.title, style: 'width:100%' });
            const done = ok => { if (ok) api.do('bookmark:rename', { id: b.id, title: input.value }); else refresh(); };
            input.onkeydown = e => { if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); };
            input.onblur = () => done(true);
            titleBox.replaceChildren(input);
            input.focus(); input.select();
          };
          return el('div', { className: 'row' }, fav(b.favicon), titleBox,
            el('button', { className: 'icon', textContent: '✎', title: 'Rename', onclick: edit }),
            el('button', { className: 'icon', textContent: '✕', title: 'Remove', onclick: () => api.do('bookmark:remove', { id: b.id }) }));
        }));
      };
      search.oninput = refresh;
      refresh();
    }

    // ---------- Downloads ----------
    function renderDownloads() {
      const list = el('div', { className: 'card' });
      main.replaceChildren(
        el('h1', { textContent: 'Downloads' }),
        el('div', { className: 'toolbar' },
          el('div', { style: 'flex:1' }),
          el('button', { textContent: 'Open downloads folder', onclick: () => api.do('downloads:folder') }),
          el('button', { textContent: 'Clear list', onclick: () => api.do('downloads:clear') })),
        list,
      );
      refresh = async () => {
        const items = await api.get('downloads');
        if (!items.length) { list.replaceChildren(el('div', { className: 'empty', textContent: 'No downloads yet.' })); return; }
        list.replaceChildren(...items.map(d => {
          const act = (text, action, cls = '') => el('button', { className: cls, textContent: text, onclick: () => api.do(action, { id: d.id }) });
          let status, buttons = [];
          if (d.state === 'progressing') {
            status = [el('div', { className: 'sub', textContent: `${size(d.received)} of ${d.total ? size(d.total) : 'unknown size'}` }),
              el('div', { className: 'bar' }, el('div', { style: `width:${d.total ? Math.round(d.received / d.total * 100) : 30}%` }))];
            buttons = [act('Cancel', 'download:cancel', 'danger')];
          } else if (d.state === 'completed') {
            status = el('div', { className: 'sub', textContent: d.exists ? `${size(d.total || d.received)} · ${host(d.url)}` : 'File deleted or moved' });
            buttons = d.exists ? [act('Open', 'download:open', 'primary'), act('Show in folder', 'download:show')] : [act('Download again', 'download:retry')];
          } else {
            status = el('div', { className: 'sub', textContent: d.state === 'cancelled' ? 'Cancelled' : 'Failed' });
            buttons = [act('Retry', 'download:retry')];
          }
          return el('div', { className: 'row' },
            el('div', { className: 'grow' }, el('div', { textContent: d.filename, style: 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }), status),
            buttons,
            el('button', { className: 'icon', textContent: '✕', title: 'Remove from list', onclick: () => api.do('download:remove', { id: d.id }) }));
        }));
      };
      refresh();
    }

    // ---------- routing ----------
    const PAGES = { settings: renderSettings, history: renderHistory, bookmarks: renderBookmarks, downloads: renderDownloads };
    function route() {
      current = PAGES[location.hash.slice(1)] ? location.hash.slice(1) : 'settings';
      document.title = TITLES[current];
      document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.page === current));
      refresh = () => {};
      PAGES[current]();
    }
    // Live updates: history/bookmarks/downloads refresh their list; settings re-renders (unless typing).
    api.on(what => {
      if (what !== current) return;
      if (current === 'settings') { if (!document.activeElement || document.activeElement.tagName !== 'INPUT' || document.activeElement.type !== 'text') renderSettings(); }
      else refresh();
    });
    window.addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
